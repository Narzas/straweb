<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3730a3"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="700" cy="-30" r="220" fill="white" fill-opacity="0.04"/>
  <circle cx="720" cy="460" r="180" fill="white" fill-opacity="0.03"/>

  <!-- Chat UI (right side) -->
  <g transform="translate(385, 55)">
    <rect width="375" height="340" rx="12" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Header bar -->
    <rect width="375" height="40" rx="12" fill="white" fill-opacity="0.06"/>
    <rect x="0" y="25" width="375" height="15" fill="white" fill-opacity="0.06"/>
    <circle cx="20" cy="20" r="6" fill="#f87171" fill-opacity="0.7"/>
    <circle cx="40" cy="20" r="6" fill="#fbbf24" fill-opacity="0.7"/>
    <circle cx="60" cy="20" r="6" fill="#4ade80" fill-opacity="0.7"/>
    <text x="187" y="25" font-family="'Segoe UI', Arial" font-size="12" fill="white" fill-opacity="0.5" text-anchor="middle">Claude</text>

    <!-- User message bubble -->
    <rect x="120" y="58" width="235" height="44" rx="10" fill="#4f46e5" fill-opacity="0.6"/>
    <text x="237" y="75" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.9" text-anchor="middle">코드 리뷰 해줄 수 있어?</text>
    <text x="237" y="91" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.7" text-anchor="middle">Java NullPointerException 자꾸 나</text>

    <!-- Claude response bubble -->
    <rect x="20" y="116" width="260" height="76" rx="10" fill="url(#bubble)" stroke="#a78bfa" stroke-opacity="0.2" stroke-width="1"/>
    <text x="32" y="134" font-family="'Segoe UI', Arial" font-size="11" fill="#c4b5fd" font-weight="600">Claude</text>
    <text x="32" y="152" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.8">Optional.ofNullable()을 사용하면</text>
    <text x="32" y="168" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.8">NPE를 안전하게 처리할 수 있어요.</text>
    <text x="32" y="184" font-family="'Segoe UI', Arial" font-size="11" fill="#a78bfa">예시 코드를 보여드릴까요?</text>

    <!-- User reply -->
    <rect x="220" y="206" width="135" height="30" rx="10" fill="#4f46e5" fill-opacity="0.6"/>
    <text x="287" y="226" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.9" text-anchor="middle">응 보여줘!</text>

    <!-- Code response -->
    <rect x="20" y="250" width="335" height="72" rx="8" fill="black" fill-opacity="0.3"/>
    <text x="32" y="268" font-family="'Courier New', monospace" font-size="10" fill="#4ade80">Optional</text>
    <text x="104" y="268" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.8">.ofNullable(user)</text>
    <text x="32" y="284" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.8">  .map(</text>
    <text x="82" y="284" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">User::getName</text>
    <text x="186" y="284" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.8">)</text>
    <text x="32" y="300" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.8">  .orElse(</text>
    <text x="100" y="300" font-family="'Courier New', monospace" font-size="10" fill="#fbbf24">"UNKNOWN"</text>
    <text x="178" y="300" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.8">);</text>

    <!-- Typing indicator -->
    <rect x="20" y="332" width="60" height="24" rx="12" fill="white" fill-opacity="0.06"/>
    <circle cx="35" cy="344" r="3" fill="white" fill-opacity="0.4"/>
    <circle cx="46" cy="344" r="3" fill="white" fill-opacity="0.4"/>
    <circle cx="57" cy="344" r="3" fill="white" fill-opacity="0.4"/>
  </g>

  <!-- Left content -->
  <!-- AI icon simplified -->
  <g transform="translate(50, 60)">
    <circle cx="50" cy="50" r="40" fill="white" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="50" y="58" font-family="Arial" font-size="28" fill="#a78bfa" fill-opacity="0.8" text-anchor="middle">✦</text>
  </g>

  <!-- Title -->
  <text x="50" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="white">Claude AI</text>
  <text x="50" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#a78bfa">제대로 쓰는 법</text>
  <text x="50" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="white" fill-opacity="0.75">처음 써보는 사람을 위한</text>
  <text x="50" y="314" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="white" fill-opacity="0.75">실전 가이드</text>

  <rect x="50" y="344" width="80" height="26" rx="13" fill="white" fill-opacity="0.12"/>
  <text x="90" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">개발</text>
</svg>
