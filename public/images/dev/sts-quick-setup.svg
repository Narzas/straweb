  <!-- Title text -->
  <text x="50" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4ade80" fill-opacity="0.9" letter-spacing="2">STS4 QUICK SETUP</text>
  <text x="50" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="white">첫 출근 첫날</text>
  <text x="50" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#4ade80">5분 셋팅</text>
  <text x="50" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.55">JDK · UTF-8 · Lombok · Dashboard</text>

  <rect x="50" y="345" width="72" height="26" rx="13" fill="white" fill-opacity="0.1"/>
  <text x="86" y="363" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">개발</text>
</svg>
