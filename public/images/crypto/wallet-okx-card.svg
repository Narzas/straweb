<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c1e"/>
      <stop offset="100%" style="stop-color:#2c2c2e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="300" fill="url(#bg)" rx="16"/>

  <!-- Blue accent bar -->
  <rect x="0" y="0" width="6" height="300" fill="#3b82f6" rx="3"/>

  <!-- OKX icon -->
  <circle cx="72" cy="80" r="36" fill="#3b82f6" fill-opacity="0.15"/>
  <text x="72" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" fill="#60a5fa" text-anchor="middle">OKX</text>

  <!-- Title -->
  <text x="124" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="white">OKX Wallet</text>
  <text x="124" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#60a5fa">멀티체인에 강한 올인원 지갑</text>

  <!-- Divider -->
  <rect x="36" y="120" width="528" height="1" fill="white" fill-opacity="0.08"/>

  <!-- Chain badges -->
  <rect x="36" y="130" width="52" height="20" rx="10" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="62" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">ETH</text>
  <rect x="96" y="130" width="52" height="20" rx="10" fill="#9945ff" fill-opacity="0.2"/>
  <text x="122" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">SOL</text>
  <rect x="156" y="130" width="52" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="182" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle">BTC</text>
  <rect x="216" y="130" width="52" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
  <text x="242" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">TRX</text>
  <text x="280" y="144" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280">+ 수십 개 체인</text>

  <!-- Pros -->
  <text x="36" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80">✓ 장점</text>
  <text x="36" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d1d5db">• 솔라나·비트코인 포함 멀티체인 한 지갑에서 관리</text>
  <text x="36" y="218" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d1d5db">• 지갑 내 내장 DEX — 앱 이동 없이 바로 스왑</text>
  <text x="36" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d1d5db">• 모바일 앱 완성도 높음</text>

  <!-- Cons -->
  <text x="36" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#f87171">✗ 단점</text>
  <text x="36" y="282" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#9ca3af">• 거래소 브랜드 연결 — 탈중앙 지갑 신뢰 측면 의구심  •  일부 dApp 미지원</text>
</svg>
