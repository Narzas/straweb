  <text x="610" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b">속도</text>
  <text x="690" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b">용도</text>

