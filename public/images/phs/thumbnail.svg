<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="200 60 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0014"/>
      <stop offset="50%" style="stop-color:#1a0030"/>
      <stop offset="100%" style="stop-color:#000510"/>
    </linearGradient>
    <linearGradient id="spotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>

  <!-- Spotlight rays -->
  <polygon points="280,0 320,0 450,450 230,450" fill="url(#spotlight)" opacity="0.5"/>
  <polygon points="460,0 510,0 620,450 490,450" fill="url(#spotlight)" opacity="0.3"/>

  <!-- Stars / bokeh -->
  <circle cx="80" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="150" cy="100" r="1" fill="white" opacity="0.4"/>
  <circle cx="600" cy="60" r="2" fill="white" opacity="0.5"/>
  <circle cx="720" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="760" cy="120" r="1" fill="white" opacity="0.3"/>
  <circle cx="50" cy="200" r="1" fill="white" opacity="0.4"/>
  <circle cx="700" cy="200" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="30" cy="350" r="1" fill="white" opacity="0.3"/>
  <circle cx="770" cy="380" r="1.5" fill="white" opacity="0.4"/>

  <!-- Stage silhouette bottom -->
  <rect x="0" y="390" width="800" height="60" fill="#0d001a" opacity="0.8"/>
  <rect x="200" y="360" width="400" height="40" rx="4" fill="#130023" opacity="0.9"/>

  <!-- Crowd silhouette -->
  <ellipse cx="120" cy="395" rx="18" ry="20" fill="#0d001a"/>
  <ellipse cx="160" cy="392" rx="16" ry="22" fill="#0d001a"/>
  <ellipse cx="200" cy="394" rx="15" ry="18" fill="#0d001a"/>
  <ellipse cx="640" cy="395" rx="18" ry="20" fill="#0d001a"/>
  <ellipse cx="680" cy="392" rx="16" ry="22" fill="#0d001a"/>
  <ellipse cx="720" cy="394" rx="15" ry="18" fill="#0d001a"/>

  <!-- Light sticks -->
  <line x1="80" y1="370" x2="80" y2="340" stroke="#c084fc" stroke-width="2" opacity="0.7"/>
  <circle cx="80" cy="338" r="4" fill="#e879f9" opacity="0.9"/>
  <line x1="140" y1="365" x2="140" y2="335" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <circle cx="140" cy="333" r="4" fill="#a5b4fc" opacity="0.9"/>
  <line x1="660" y1="370" x2="660" y2="340" stroke="#c084fc" stroke-width="2" opacity="0.7"/>
  <circle cx="660" cy="338" r="4" fill="#e879f9" opacity="0.9"/>
  <line x1="700" y1="365" x2="700" y2="335" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <circle cx="700" cy="333" r="4" fill="#a5b4fc" opacity="0.9"/>

  <!-- Main title -->
  <text x="400" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#c084fc" fill-opacity="0.9" letter-spacing="5" text-anchor="middle">PARK HYO SHIN</text>
  <text x="400" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" opacity="0.97">박효신 콘서트</text>
  <text x="400" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#c084fc" text-anchor="middle">LIVE A &amp; E 2026</text>

  <!-- Subtitle -->
  <text x="400" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="white" fill-opacity="0.5" text-anchor="middle">7년 만의 귀환 · 인천문학경기장</text>

  <!-- Badge -->
  <rect x="333" y="335" width="134" height="28" rx="14" fill="#7c3aed" fill-opacity="0.3" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1"/>
  <text x="400" y="354" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#e9d5ff" text-anchor="middle">콘서트 후기 · 2026.04</text>
</svg>
