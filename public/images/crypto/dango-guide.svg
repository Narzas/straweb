<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0a1a"/>
      <stop offset="55%" style="stop-color:#150d22"/>
      <stop offset="100%" style="stop-color:#1a0d2e"/>
    </linearGradient>
    <linearGradient id="dangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:#c44dff"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="100%" style="stop-color:#c44dff"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#c44dff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#c44dff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleglow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#ff6b9d" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Soft glow blob right -->
  <circle cx="630" cy="225" r="180" fill="#c44dff" opacity="0.05" filter="url(#softglow)"/>

  <!-- ── Right: Dango illustration ── -->
  <rect x="618" y="48" width="16" height="330" rx="8" fill="#7a5c44" opacity="0.9"/>

  <!-- Top ball - matcha green -->
  <circle cx="626" cy="100" r="60" fill="#4caf7d" filter="url(#glow)"/>
  <circle cx="626" cy="100" r="60" fill="none" stroke="#6ee8a4" stroke-width="3" opacity="0.5"/>
  <ellipse cx="606" cy="82" rx="16" ry="10" fill="#6ee8a4" opacity="0.3" transform="rotate(-20 606 82)"/>

  <!-- Middle ball - pink/purple -->
  <circle cx="626" cy="225" r="60" fill="url(#dangoGrad)" filter="url(#glow)"/>
  <circle cx="626" cy="225" r="60" fill="none" stroke="#ff9ec8" stroke-width="3" opacity="0.5"/>
  <ellipse cx="606" cy="207" rx="16" ry="10" fill="#ffb8da" opacity="0.3" transform="rotate(-20 606 207)"/>
  <text x="626" y="233" font-family="'Courier New', monospace" font-size="22" font-weight="bold"
        fill="white" text-anchor="middle" opacity="0.95">DNG</text>

  <!-- Bottom ball - white/cream -->
  <circle cx="626" cy="350" r="60" fill="#f0e8ff" filter="url(#glow)"/>
  <circle cx="626" cy="350" r="60" fill="none" stroke="#d4b8ff" stroke-width="3" opacity="0.45"/>
  <ellipse cx="606" cy="332" rx="16" ry="10" fill="#e8d8ff" opacity="0.3" transform="rotate(-20 606 332)"/>

  <!-- ── Left: Text (읽히는 크기 기준) ── -->

  <!-- Badge row — 20px text, 44px tall -->
  <rect x="48" y="44" width="96" height="40" rx="8" fill="#ff6b9d" fill-opacity="0.18" stroke="#ff6b9d" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="96" y="70" font-family="'Courier New', monospace" font-size="20" font-weight="bold"
        fill="#ff6b9d" text-anchor="middle">CLOB</text>

  <rect x="156" y="44" width="106" height="40" rx="8" fill="#c44dff" fill-opacity="0.18" stroke="#c44dff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="209" y="70" font-family="'Courier New', monospace" font-size="20" font-weight="bold"
        fill="#c44dff" text-anchor="middle">Layer 1</text>

  <rect x="274" y="44" width="112" height="40" rx="8" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="330" y="70" font-family="'Courier New', monospace" font-size="20" font-weight="bold"
        fill="#00d4ff" text-anchor="middle">Airdrop</text>

  <!-- Main title — 82px -->
  <text x="48" y="185" font-family="'Courier New', monospace" font-size="82" font-weight="bold"
        fill="url(#titleGrad)" text-anchor="start" filter="url(#titleglow)">DANGO</text>

  <!-- Subtitle — 34px -->
  <text x="50" y="238" font-family="'Courier New', monospace" font-size="34" font-weight="bold"
        fill="#ffffff" text-anchor="start" opacity="0.55">에어드랍 전략 가이드</text>

  <!-- Accent line -->
  <rect x="48" y="268" width="500" height="2.5" fill="url(#accentLine)" rx="1"/>

  <!-- Two key stat pills — 24px text -->
  <rect x="48" y="292" width="210" height="50" rx="10" fill="#ffffff" fill-opacity="0.06"/>
  <text x="153" y="324" font-family="'Courier New', monospace" font-size="24" font-weight="bold"
        fill="#ff6b9d" text-anchor="middle">Perps · Vault</text>

  <rect x="274" y="292" width="240" height="50" rx="10" fill="#ffffff" fill-opacity="0.06"/>
  <text x="394" y="324" font-family="'Courier New', monospace" font-size="24" font-weight="bold"
        fill="#c44dff" text-anchor="middle">TGE 2026</text>

  <!-- Bottom domain -->
  <text x="50" y="412" font-family="'Courier New', monospace" font-size="22"
        fill="#555" text-anchor="start">dango.exchange</text>

  <!-- Decorative dots -->
  <circle cx="50" cy="440" r="4" fill="#ff6b9d" opacity="0.35"/>
  <circle cx="68" cy="440" r="3" fill="#c44dff" opacity="0.25"/>
</svg>
