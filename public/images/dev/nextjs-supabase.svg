<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="60%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c2e"/>
      <stop offset="100%" style="stop-color:#12121e"/>
    </linearGradient>
    <linearGradient id="nextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#aaaaaa"/>
    </linearGradient>
    <linearGradient id="sbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ecf8e"/>
      <stop offset="100%" style="stop-color:#1a9e6a"/>
    </linearGradient>
    <linearGradient id="lineLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#3ecf8e;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#3ecf8e;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="390" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="130" x2="390" y2="130" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="260" x2="390" y2="260" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="130" y1="0" x2="130" y2="390" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="260" y1="0" x2="260" y2="390" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Glow orb top right -->
  <circle cx="340" cy="50" r="90" fill="#3ecf8e" fill-opacity="0.06"/>
  <circle cx="50" cy="340" r="70" fill="#ffffff" fill-opacity="0.03"/>

  <!-- === Card: Next.js === -->
  <rect x="24" y="100" width="158" height="100" rx="10" fill="url(#cardGrad)" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Next.js triangle logo -->
  <polygon points="68,124 102,124 68,158" fill="url(#nextGrad)" opacity="0.9"/>
  <text x="113" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Next.js</text>
  <text x="113" y="157" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.4" text-anchor="middle">App Router</text>
  <!-- Pills -->
  <rect x="36" y="172" width="54" height="16" rx="8" fill="white" fill-opacity="0.06"/>
  <text x="63" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.5" text-anchor="middle">RSC</text>
  <rect x="96" y="172" width="74" height="16" rx="8" fill="white" fill-opacity="0.06"/>
  <text x="133" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.5" text-anchor="middle">Server Action</text>

  <!-- === Card: Supabase === -->
  <rect x="208" y="100" width="158" height="100" rx="10" fill="url(#cardGrad)" stroke="#3ecf8e" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Supabase bolt logo simplified -->
  <polygon points="277,120 263,145 272,145 258,170 278,143 268,143" fill="url(#sbGrad)" opacity="0.95"/>
  <text x="308" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#3ecf8e" text-anchor="middle">Supabase</text>
  <text x="308" y="157" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#3ecf8e" fill-opacity="0.5" text-anchor="middle">BaaS</text>
  <!-- Pills -->
  <rect x="220" y="172" width="38" height="16" rx="8" fill="#3ecf8e" fill-opacity="0.08"/>
  <text x="239" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#3ecf8e" fill-opacity="0.7" text-anchor="middle">Auth</text>
  <rect x="264" y="172" width="26" height="16" rx="8" fill="#3ecf8e" fill-opacity="0.08"/>
  <text x="277" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#3ecf8e" fill-opacity="0.7" text-anchor="middle">DB</text>
  <rect x="296" y="172" width="58" height="16" rx="8" fill="#3ecf8e" fill-opacity="0.08"/>
  <text x="325" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#3ecf8e" fill-opacity="0.7" text-anchor="middle">Realtime</text>

  <!-- Connector line between cards -->
  <line x1="182" y1="150" x2="208" y2="150" stroke="url(#lineLine)" stroke-width="1.5"/>
  <!-- Arrow head -->
  <polygon points="205,146 211,150 205,154" fill="#3ecf8e" fill-opacity="0.6"/>
  <!-- Plus in middle -->
  <circle cx="195" cy="150" r="9" fill="#0d1117" stroke="#3ecf8e" stroke-opacity="0.3" stroke-width="1"/>
  <text x="195" y="155" font-family="Arial" font-size="13" fill="#3ecf8e" fill-opacity="0.8" text-anchor="middle">+</text>

  <!-- Code snippet block -->
  <rect x="24" y="222" width="342" height="110" rx="10" fill="black" fill-opacity="0.4" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Dot buttons -->
  <circle cx="40" cy="236" r="4" fill="#f87171" fill-opacity="0.6"/>
  <circle cx="54" cy="236" r="4" fill="#fbbf24" fill-opacity="0.6"/>
  <circle cx="68" cy="236" r="4" fill="#4ade80" fill-opacity="0.6"/>

  <text x="36" y="260" font-family="'Courier New', monospace" font-size="11" fill="#6b7280">// Server Component</text>
  <text x="36" y="277" font-family="'Courier New', monospace" font-size="11" fill="#818cf8">const</text>
  <text x="72" y="277" font-family="'Courier New', monospace" font-size="11" fill="white" fill-opacity="0.85"> supabase = </text>
  <text x="171" y="277" font-family="'Courier New', monospace" font-size="11" fill="#4ade80">createClient()</text>
  <text x="36" y="294" font-family="'Courier New', monospace" font-size="11" fill="#818cf8">const</text>
  <text x="72" y="294" font-family="'Courier New', monospace" font-size="11" fill="white" fill-opacity="0.85"> { data } = </text>
  <text x="145" y="294" font-family="'Courier New', monospace" font-size="11" fill="#60a5fa">await</text>
  <text x="183" y="294" font-family="'Courier New', monospace" font-size="11" fill="white" fill-opacity="0.85"> supabase</text>
  <text x="36" y="311" font-family="'Courier New', monospace" font-size="11" fill="white" fill-opacity="0.6">   .from(</text>
  <text x="98" y="311" font-family="'Courier New', monospace" font-size="11" fill="#fbbf24">'posts'</text>
  <text x="145" y="311" font-family="'Courier New', monospace" font-size="11" fill="white" fill-opacity="0.6">).select(</text>
  <text x="211" y="311" font-family="'Courier New', monospace" font-size="11" fill="#fbbf24">'*'</text>
  <text x="228" y="311" font-family="'Courier New', monospace" font-size="11" fill="white" fill-opacity="0.6">)</text>

  <!-- Title text -->
  <text x="24" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="white">Next.js + Supabase</text>
  <text x="24" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="white" fill-opacity="0.5">실전 스택 조합 가이드</text>

  <!-- Category badge -->
  <rect x="314" y="352" width="52" height="22" rx="11" fill="white" fill-opacity="0.08"/>
  <text x="340" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="white" fill-opacity="0.7" text-anchor="middle">개발</text>
</svg>
