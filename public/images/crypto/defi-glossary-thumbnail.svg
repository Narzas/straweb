<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="defiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="coinA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coinB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <rect width="390" height="390" fill="url(#defiBg)"/>

  <!-- Decorative gridlines -->
  <g stroke="white" stroke-opacity="0.04">
    <line x1="0" y1="120" x2="390" y2="120" stroke-width="1"/>
    <line x1="0" y1="200" x2="390" y2="200" stroke-width="1"/>
    <line x1="0" y1="280" x2="390" y2="280" stroke-width="1"/>
  </g>

  <!-- Decorative glowing circles -->
  <circle cx="340" cy="60" r="80" fill="#3b82f6" fill-opacity="0.12"/>
  <circle cx="60" cy="340" r="80" fill="#10b981" fill-opacity="0.12"/>

  <!-- AMM curve hint (xy=k hyperbola) -->
  <g transform="translate(35, 215)">
    <!-- Axes -->
    <line x1="0" y1="120" x2="180" y2="120" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="120" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="-3" y="-4" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.6">ETH</text>
    <text x="186" y="124" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.6">USDC</text>
    <!-- Hyperbola -->
    <path d="M 6,8 Q 30,30 50,55 Q 80,90 130,108 Q 160,114 175,116" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
    <!-- Two points showing trade -->
    <circle cx="50" cy="55" r="5" fill="#fbbf24"/>
    <circle cx="130" cy="108" r="5" fill="#a78bfa"/>
    <line x1="50" y1="55" x2="130" y2="108" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.6"/>
    <!-- Formula -->
    <text x="100" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="white" fill-opacity="0.9">x · y = k</text>
  </g>

  <!-- Coin icons (top-right) -->
  <g transform="translate(245, 195)">
    <circle cx="22" cy="22" r="22" fill="url(#coinA)"/>
    <text x="22" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="white">Ξ</text>
    <circle cx="60" cy="22" r="22" fill="url(#coinB)"/>
    <text x="60" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="white">$</text>
  </g>

  <!-- Title -->
  <text x="30" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="white">DeFi</text>
  <text x="30" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="white">용어집</text>

  <!-- Year badge -->
  <rect x="148" y="50" width="68" height="32" rx="16" fill="white" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="182" y="71" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">2026</text>

  <!-- Subtitle -->
  <text x="30" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7">AMM · LP · 슬리피지 · MEV</text>
  <text x="30" y="166" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7">청산 · 펀딩비 · 파밍 · 플래시 론</text>

  <!-- Bottom badge -->
  <rect x="30" y="345" width="56" height="26" rx="13" fill="white" fill-opacity="0.18"/>
  <text x="58" y="363" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="white">크립토</text>
</svg>
