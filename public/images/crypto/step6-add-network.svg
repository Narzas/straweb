  <text x="530" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fca5a5">높음</text>
  <text x="610" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fde68a">보통</text>
  <text x="690" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">NFT/DeFi</text>

