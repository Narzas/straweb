<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="l1l2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="700" height="380" fill="url(#l1l2Bg)" rx="16"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="bold">L1 위에 올라타는 L2 — 빠르고 싸게 처리하고 결과만 L1에 정산</text>

  <!-- L2 layer (top) -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="13" fill="#67e8f9" font-weight="bold">L2 (Layer 2)</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="10" fill="#a5f3fc">빠르고 저렴 — 실제 거래는 여기서</text>

  <!-- L2 cards -->
  <g>
    <rect x="60" y="115" width="115" height="60" rx="10" fill="url(#l2Grad)" stroke="#67e8f9" stroke-width="1"/>
    <text x="117" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Base</text>
    <text x="117" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">Optimistic</text>
    <text x="117" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">Coinbase</text>

    <rect x="190" y="115" width="115" height="60" rx="10" fill="url(#l2Grad)" stroke="#67e8f9" stroke-width="1"/>
    <text x="247" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Arbitrum</text>
    <text x="247" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">Optimistic</text>
    <text x="247" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">DeFi 1위</text>

    <rect x="320" y="115" width="115" height="60" rx="10" fill="url(#l2Grad)" stroke="#67e8f9" stroke-width="1"/>
    <text x="377" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Optimism</text>
    <text x="377" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">Optimistic</text>
    <text x="377" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">Superchain</text>

    <rect x="450" y="115" width="115" height="60" rx="10" fill="url(#l2Grad)" stroke="#67e8f9" stroke-width="1"/>
    <text x="507" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">zkSync</text>
    <text x="507" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">ZK Rollup</text>
    <text x="507" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">즉시 정산</text>

    <rect x="580" y="115" width="80" height="60" rx="10" fill="url(#l2Grad)" stroke="#67e8f9" stroke-width="1"/>
    <text x="620" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Linea</text>
    <text x="620" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">ZK</text>
    <text x="620" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#cffafe">MetaMask</text>
  </g>

  <!-- Arrows down -->
  <g stroke="#a78bfa" stroke-width="1.5" fill="#a78bfa">
    <line x1="117" y1="180" x2="117" y2="220"/>
    <polygon points="113,216 117,225 121,216"/>
    <line x1="247" y1="180" x2="247" y2="220"/>
    <polygon points="243,216 247,225 251,216"/>
    <line x1="377" y1="180" x2="377" y2="220"/>
    <polygon points="373,216 377,225 381,216"/>
    <line x1="507" y1="180" x2="507" y2="220"/>
    <polygon points="503,216 507,225 511,216"/>
    <line x1="620" y1="180" x2="620" y2="220"/>
    <polygon points="616,216 620,225 624,216"/>
  </g>

  <text x="350" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c7d2fe">압축된 거래 결과를 정산</text>

  <!-- L1 layer (bottom) -->
  <rect x="60" y="232" width="600" height="100" rx="12" fill="url(#l1Grad)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="80" y="262" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">L1 (Layer 1) — Ethereum</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="11" fill="#c7d2fe">최종 보안 · 합의 · 정산</text>
  <text x="80" y="298" font-family="Arial, sans-serif" font-size="10" fill="#a5b4fc">느리지만 가장 안전 — 모든 L2의 최종 정산소</text>

  <!-- ETH icon area -->
  <circle cx="600" cy="282" r="28" fill="#3730a3" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="600" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fbbf24">Ξ</text>

  <!-- Bottom note -->
  <text x="350" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc">L1: 무거운 보안금고  |  L2: 그 위에서 빠르게 돌아가는 결제 라인</text>
</svg>
