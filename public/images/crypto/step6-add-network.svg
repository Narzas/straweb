  <text x="96" y="190" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Ξ</text>
  <text x="118" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111827">Ethereum Mainnet</text>
  <text x="118" y="197" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b7280">현재 연결됨</text>
  <text x="330" y="187" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">✓</text>

