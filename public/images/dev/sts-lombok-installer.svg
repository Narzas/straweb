<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="lbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#lbg)"/>

  <text x="500" y="50" font-family="'Segoe UI', Arial" font-size="22" font-weight="800" fill="white" text-anchor="middle">Lombok Installer — STS 자동 감지</text>

  <!-- Installer window -->
  <g transform="translate(140, 100)">
    <rect width="720" height="420" rx="10" fill="#1e293b" stroke="white" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Title bar -->
    <rect width="720" height="34" rx="10" fill="#0f172a"/>
    <rect y="24" width="720" height="10" fill="#0f172a"/>
    <text x="360" y="22" font-family="'Segoe UI', Arial" font-size="12" font-weight="600" fill="white" fill-opacity="0.7" text-anchor="middle">Project Lombok v1.18.34 — Installer</text>

    <!-- Project Lombok logo area -->
    <g transform="translate(40, 60)">
      <rect width="80" height="80" rx="12" fill="#ef4444" fill-opacity="0.85"/>
      <text x="40" y="52" font-family="'Segoe UI', Arial" font-size="32" font-weight="800" fill="white" text-anchor="middle">L</text>
    </g>
    <text x="140" y="86" font-family="'Segoe UI', Arial" font-size="20" font-weight="700" fill="white">Project Lombok</text>
    <text x="140" y="108" font-family="'Segoe UI', Arial" font-size="12" fill="white" fill-opacity="0.6">Auto-generated getters, setters, constructors</text>
    <text x="140" y="128" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.4">v1.18.34 · Compatible with JDK 17/21</text>

    <line x1="40" y1="170" x2="680" y2="170" stroke="white" stroke-opacity="0.1"/>

    <!-- IDEs detected list -->
    <text x="40" y="198" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="white">IDEs found on your machine:</text>

    <!-- STS row (checked) -->
    <g transform="translate(40, 218)">
      <rect width="640" height="44" rx="6" fill="#4ade80" fill-opacity="0.1" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="14" y="14" width="16" height="16" rx="3" fill="#4ade80"/>
      <path d="M 17 22 L 21 26 L 27 19" stroke="#0b1220" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="28" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="white">Spring Tool Suite 4</text>
      <text x="200" y="28" font-family="'Consolas', monospace" font-size="11" fill="white" fill-opacity="0.5">C:\sts-4.21.0.RELEASE\SpringToolSuite4.exe</text>
    </g>

    <!-- Eclipse row (unchecked) -->
    <g transform="translate(40, 270)">
      <rect width="640" height="44" rx="6" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
      <rect x="14" y="14" width="16" height="16" rx="3" fill="none" stroke="white" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="44" y="28" font-family="'Segoe UI', Arial" font-size="13" fill="white" fill-opacity="0.7">Eclipse 2024-09</text>
      <text x="200" y="28" font-family="'Consolas', monospace" font-size="11" fill="white" fill-opacity="0.4">C:\eclipse\eclipse.exe</text>
    </g>

    <!-- Bottom buttons -->
    <g transform="translate(40, 340)">
      <text x="0" y="14" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">선택 후 Install / Update 클릭, 끝나면 STS 재시작</text>

      <rect x="450" y="34" width="100" height="36" rx="4" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.15"/>
      <text x="500" y="57" font-family="'Segoe UI', Arial" font-size="12" fill="white" fill-opacity="0.7" text-anchor="middle">Quit Installer</text>

      <rect x="560" y="34" width="120" height="36" rx="4" fill="#22c55e"/>
      <text x="620" y="57" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="#0a1628" text-anchor="middle">Install / Update</text>
    </g>
  </g>

  <!-- Bottom note -->
  <text x="500" y="560" font-family="'Segoe UI', Arial" font-size="13" fill="white" fill-opacity="0.5" text-anchor="middle">jar 더블클릭 → 자동 감지 → 클릭 한 번으로 javaagent 등록까지 완료</text>
</svg>
