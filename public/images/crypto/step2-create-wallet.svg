<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Step label -->
  <rect x="30" y="24" width="80" height="28" rx="14" fill="#f6851b"/>
  <text x="70" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">STEP 2</text>

  <text x="30" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white">새 지갑 만들기 선택</text>

  <!-- MetaMask popup -->
  <rect x="220" y="100" width="360" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Popup header (orange) -->
  <rect x="220" y="100" width="360" height="60" rx="16" fill="#f6851b"/>
  <rect x="220" y="140" width="360" height="20" fill="#f6851b"/>
  <!-- Fox emoji -->
  <text x="400" y="138" font-family="Arial" font-size="28" text-anchor="middle">🦊</text>
  <text x="400" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9" text-anchor="middle" font-weight="600">MetaMask에 오신 것을 환영합니다</text>

  <!-- Welcome text -->
  <text x="400" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#374151" text-anchor="middle" font-weight="600">시작하는 방법을 선택하세요</text>

  <!-- New wallet button (highlighted) -->
  <rect x="248" y="212" width="304" height="60" rx="12" fill="#f6851b"/>
  <text x="400" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">새 지갑 만들기</text>
  <text x="400" y="258" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.85" text-anchor="middle">MetaMask를 처음 사용하는 경우</text>

  <!-- Divider with OR -->
  <rect x="248" y="286" width="135" height="1" fill="#e5e7eb"/>
  <text x="400" y="291" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">또는</text>
  <rect x="417" y="286" width="135" height="1" fill="#e5e7eb"/>

  <!-- Import wallet button -->
  <rect x="248" y="302" width="304" height="54" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="400" y="326" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">기존 지갑 가져오기</text>
  <text x="400" y="344" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">시드 구문이 이미 있는 경우</text>

  <!-- Arrow indicator -->
  <polygon points="245,242 230,254 245,266" fill="#f6851b"/>
  <text x="215" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#f6851b" text-anchor="middle" transform="rotate(-90,215,255)">선택</text>

  <!-- Left annotation -->
  <rect x="30" y="170" width="170" height="90" rx="10" fill="#1e293b" stroke="#f6851b" stroke-width="1.5"/>
  <text x="115" y="198" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#f6851b" text-anchor="middle">처음이라면</text>
  <text x="115" y="218" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">이 버튼 선택!</text>
  <text x="115" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">새 지갑 + 시드구문</text>
  <text x="115" y="254" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">이 함께 생성됩니다</text>
  <line x1="200" y1="215" x2="228" y2="242" stroke="#f6851b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Right annotation -->
  <rect x="610" y="290" width="160" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="690" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">기존 지갑 복구 시</text>
  <text x="690" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">시드 구문 12단어가</text>
  <text x="690" y="353" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">필요합니다</text>
  <line x1="610" y1="330" x2="552" y2="330" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
