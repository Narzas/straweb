  <text x="30" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white">네트워크 추가 (선택)</text>

  <!-- Network dropdown -->
  <rect x="60" y="110" width="300" height="310" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <rect x="60" y="110" width="300" height="44" rx="12" fill="#f9fafb"/>
  <rect x="60" y="136" width="300" height="18" fill="#f9fafb"/>
  <text x="210" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">네트워크 선택</text>

  <!-- Ethereum (current) -->
  <rect x="72" y="162" width="276" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
