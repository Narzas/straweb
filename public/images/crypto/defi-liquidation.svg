<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <defs>
    <linearGradient id="liqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="collGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="debtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="collDropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect width="700" height="320" fill="url(#liqBg)" rx="16"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="bold">대출 청산 메커니즘 — 담보 가격이 떨어지면 자동 발동</text>

  <!-- Step labels -->
  <text x="130" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#86efac">1. 정상 상태 (HF &gt; 1.5)</text>
  <text x="350" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">2. ETH 가격 하락 (HF &lt; 1)</text>
  <text x="570" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ef4444">3. 청산 발동</text>

  <!-- Threshold dotted line -->
  <line x1="40" y1="170" x2="660" y2="170" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.6"/>
  <!-- Label placed above the bars to avoid being hidden behind them -->
  <text x="350" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ef4444">↓ 청산 임계점 (LTV 80%)</text>

  <!-- ===== Step 1: Healthy ===== -->
  <g transform="translate(60, 90)">
    <!-- Collateral bar -->
    <rect x="20" y="0" width="50" height="180" rx="4" fill="url(#collGrad)"/>
    <text x="45" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">담보</text>
    <text x="45" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.9">ETH</text>
    <text x="45" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">$3,000</text>

    <!-- Debt bar -->
    <rect x="90" y="80" width="50" height="100" rx="4" fill="url(#debtGrad)"/>
    <text x="115" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">부채</text>
    <text x="115" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.9">USDC</text>
    <text x="115" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">$1,800</text>

    <!-- HF -->
    <text x="80" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#86efac" font-weight="bold">HF = 1.67</text>
  </g>

  <!-- Arrow 1 → 2 -->
  <line x1="225" y1="180" x2="265" y2="180" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="265,175 275,180 265,185" fill="#fbbf24"/>
  <text x="245" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fbbf24">ETH ↓</text>

  <!-- ===== Step 2: ETH dropped ===== -->
  <g transform="translate(285, 90)">
    <!-- Collateral bar (smaller, danger color) -->
    <rect x="20" y="60" width="50" height="120" rx="4" fill="url(#collDropGrad)"/>
    <text x="45" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">담보</text>
    <text x="45" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.9">ETH</text>
    <text x="45" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">$2,100</text>

    <!-- Down arrow indicator -->
    <text x="-2" y="80" font-family="Arial, sans-serif" font-size="14" fill="#ef4444" font-weight="bold">↓</text>

    <!-- Debt bar same size -->
    <rect x="90" y="80" width="50" height="100" rx="4" fill="url(#debtGrad)"/>
    <text x="115" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">부채</text>
    <text x="115" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.9">USDC</text>
    <text x="115" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">$1,800</text>

    <!-- HF -->
    <text x="80" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fca5a5" font-weight="bold">HF = 0.93 ⚠</text>
  </g>

  <!-- Arrow 2 → 3 -->
  <line x1="450" y1="180" x2="490" y2="180" stroke="#ef4444" stroke-width="2"/>
  <polygon points="490,175 500,180 490,185" fill="#ef4444"/>
  <text x="470" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ef4444">청산봇</text>

  <!-- ===== Step 3: Liquidator ===== -->
  <g transform="translate(510, 90)">
    <!-- Liquidator action box -->
    <rect x="0" y="40" width="155" height="140" rx="8" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5"/>
    <text x="77" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5">청산봇이 즉시 실행</text>

    <!-- Action 1 -->
    <text x="14" y="88" font-family="Arial, sans-serif" font-size="10" fill="white">① 부채 $1,800 대납</text>
    <!-- Action 2 -->
    <text x="14" y="108" font-family="Arial, sans-serif" font-size="10" fill="white">② 담보 ETH 가져감</text>
    <!-- Action 3 -->
    <text x="14" y="128" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24">③ + 5–10% 페널티</text>
    <text x="14" y="146" font-family="Arial, sans-serif" font-size="9" fill="#fbbf24" fill-opacity="0.85">     = 청산봇 수익</text>
    <!-- Position closed -->
    <text x="77" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#86efac">포지션 닫힘</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">청산은 사람이 아니라 봇이 한다 — 0.1초 단위로 모니터링하다가 HF가 1 아래로 떨어지면 즉시 발동</text>
</svg>
