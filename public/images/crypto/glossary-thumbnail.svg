<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="390" height="390" fill="url(#bg)"/>

  <!-- Decorative gridlines -->
  <g stroke="white" stroke-opacity="0.04">
    <line x1="0" y1="120" x2="390" y2="120" stroke-width="1"/>
    <line x1="0" y1="200" x2="390" y2="200" stroke-width="1"/>
    <line x1="0" y1="280" x2="390" y2="280" stroke-width="1"/>
  </g>

  <!-- Decorative glowing circles -->
  <circle cx="340" cy="60" r="80" fill="#6366f1" fill-opacity="0.12"/>
  <circle cx="60" cy="340" r="80" fill="#a855f7" fill-opacity="0.12"/>

  <!-- Blockchain icon row (4 connected blocks) -->
  <g transform="translate(35, 220)">
    <!-- Block 1 -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="url(#blockGrad)" opacity="0.9"/>
    <text x="30" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="white">BLOCK</text>
    <text x="30" y="44" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="white">#1</text>
    <!-- Connector -->
    <line x1="60" y1="30" x2="80" y2="30" stroke="#a78bfa" stroke-width="2"/>

    <!-- Block 2 -->
    <rect x="80" y="0" width="60" height="60" rx="8" fill="url(#blockGrad)" opacity="0.9"/>
    <text x="110" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="white">BLOCK</text>
    <text x="110" y="44" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="white">#2</text>
    <line x1="140" y1="30" x2="160" y2="30" stroke="#a78bfa" stroke-width="2"/>

    <!-- Block 3 -->
    <rect x="160" y="0" width="60" height="60" rx="8" fill="url(#blockGrad)" opacity="0.9"/>
    <text x="190" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="white">BLOCK</text>
    <text x="190" y="44" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="white">#3</text>
    <line x1="220" y1="30" x2="240" y2="30" stroke="#a78bfa" stroke-width="2"/>

    <!-- Block 4 -->
    <rect x="240" y="0" width="60" height="60" rx="8" fill="url(#blockGrad)" opacity="0.9" stroke="#fbbf24" stroke-width="2"/>
    <text x="270" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="white">NEW</text>
    <text x="270" y="44" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="white">#4</text>
  </g>

  <!-- Title -->
  <text x="30" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="white">블록체인</text>
  <text x="30" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="white">용어집</text>

  <!-- Year badge -->
  <rect x="200" y="50" width="68" height="32" rx="16" fill="white" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="234" y="71" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">2026</text>

  <!-- Subtitle -->
  <text x="30" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7">리스테이킹 · 모듈러 · 인텐트</text>
  <text x="30" y="166" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7">RWA · DePIN · AI 에이전트</text>

  <!-- Bottom badge -->
  <rect x="30" y="305" width="56" height="26" rx="13" fill="white" fill-opacity="0.18"/>
  <text x="58" y="323" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="white">크립토</text>

  <!-- Tagline -->
  <text x="30" y="360" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.5">코인판에서 자주 마주치는 단어들</text>
</svg>
