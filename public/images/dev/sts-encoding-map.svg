<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <defs>
    <linearGradient id="encbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="url(#encbg)"/>

  <!-- Title -->
  <text x="500" y="56" font-family="'Segoe UI', Arial" font-size="24" font-weight="800" fill="white" text-anchor="middle">UTF-8 박아야 하는 4군데</text>
  <text x="500" y="84" font-family="'Segoe UI', Arial" font-size="14" fill="white" fill-opacity="0.55" text-anchor="middle">한 군데라도 빠지면 한글이 ???로 깨집니다</text>

  <!-- Center hub -->
  <g transform="translate(500, 320)">
    <circle r="78" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.4" stroke-width="2"/>
    <circle r="58" fill="#4ade80" fill-opacity="0.18"/>
    <text y="-8" font-family="'Segoe UI', Arial" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="700" letter-spacing="2">CHARSET</text>
    <text y="20" font-family="'Segoe UI', Arial" font-size="22" font-weight="800" fill="white" text-anchor="middle">UTF-8</text>
  </g>

  <!-- Connector lines -->
  <line x1="500" y1="320" x2="220" y2="200" stroke="#4ade80" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="500" y1="320" x2="780" y2="200" stroke="#4ade80" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="500" y1="320" x2="220" y2="460" stroke="#4ade80" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="500" y1="320" x2="780" y2="460" stroke="#4ade80" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Card 1: Workspace (top-left) -->
  <g transform="translate(60, 140)">
    <rect width="320" height="140" rx="12" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#4ade80" fill-opacity="0.2"/>
    <text x="36" y="42" font-family="'Segoe UI', Arial" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">1</text>
    <text x="64" y="36" font-family="'Segoe UI', Arial" font-size="16" font-weight="700" fill="white">Workspace</text>
    <text x="64" y="55" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">전역 인코딩 기본값</text>
    <line x1="20" y1="74" x2="300" y2="74" stroke="white" stroke-opacity="0.08"/>
    <text x="20" y="98" font-family="'Consolas', monospace" font-size="11" fill="#fbbf24">Window &gt; Preferences</text>
    <text x="20" y="116" font-family="'Consolas', monospace" font-size="11" fill="#fbbf24">&gt; General &gt; Workspace</text>
  </g>

  <!-- Card 2: Web Files (top-right) -->
  <g transform="translate(620, 140)">
    <rect width="320" height="140" rx="12" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#4ade80" fill-opacity="0.2"/>
    <text x="36" y="42" font-family="'Segoe UI', Arial" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">2</text>
    <text x="64" y="36" font-family="'Segoe UI', Arial" font-size="16" font-weight="700" fill="white">Web Files</text>
    <text x="64" y="55" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">CSS · HTML · JSP</text>
    <line x1="20" y1="74" x2="300" y2="74" stroke="white" stroke-opacity="0.08"/>
    <text x="20" y="98" font-family="'Consolas', monospace" font-size="11" fill="#fbbf24">Preferences &gt; Web</text>
    <text x="20" y="116" font-family="'Consolas', monospace" font-size="11" fill="#fbbf24">&gt; (각 파일타입) Files</text>
  </g>

  <!-- Card 3: Content Types (bottom-left) -->
  <g transform="translate(60, 400)">
    <rect width="320" height="140" rx="12" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#4ade80" fill-opacity="0.2"/>
    <text x="36" y="42" font-family="'Segoe UI', Arial" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">3</text>
    <text x="64" y="36" font-family="'Segoe UI', Arial" font-size="16" font-weight="700" fill="white">Content Types</text>
    <text x="64" y="55" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">파일별 default encoding</text>
    <line x1="20" y1="74" x2="300" y2="74" stroke="white" stroke-opacity="0.08"/>
    <text x="20" y="98" font-family="'Consolas', monospace" font-size="11" fill="#fbbf24">Preferences &gt; General</text>
    <text x="20" y="116" font-family="'Consolas', monospace" font-size="11" fill="#fbbf24">&gt; Content Types</text>
  </g>

  <!-- Card 4: Project Property (bottom-right) -->
  <g transform="translate(620, 400)">
    <rect width="320" height="140" rx="12" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="20" y="20" width="32" height="32" rx="8" fill="#4ade80" fill-opacity="0.2"/>
    <text x="36" y="42" font-family="'Segoe UI', Arial" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">4</text>
    <text x="64" y="36" font-family="'Segoe UI', Arial" font-size="16" font-weight="700" fill="white">Project Property</text>
    <text x="64" y="55" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">프로젝트 단위 재설정</text>
    <line x1="20" y1="74" x2="300" y2="74" stroke="white" stroke-opacity="0.08"/>
    <text x="20" y="98" font-family="'Consolas', monospace" font-size="11" fill="#fbbf24">프로젝트 우클릭</text>
    <text x="20" y="116" font-family="'Consolas', monospace" font-size="11" fill="#fbbf24">&gt; Properties &gt; Resource</text>
  </g>

  <!-- Bottom warning -->
  <rect x="200" y="580" width="600" height="40" rx="20" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
  <text x="500" y="606" font-family="'Segoe UI', Arial" font-size="13" font-weight="600" fill="#fca5a5" text-anchor="middle">Windows 기본값 = MS949. 한 군데만 빠져도 그 영역만 깨집니다.</text>
</svg>
