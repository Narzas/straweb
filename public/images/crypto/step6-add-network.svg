  <rect x="72" y="372" width="276" height="34" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="210" y="394" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#f6851b" text-anchor="middle">+ 커스텀 네트워크 추가</text>

