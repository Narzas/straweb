<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6851b"/>
      <stop offset="100%" style="stop-color:#e2761b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="680" cy="-40" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="750" cy="420" r="150" fill="white" fill-opacity="0.05"/>
  <circle cx="-30" cy="300" r="120" fill="white" fill-opacity="0.05"/>

  <!-- MetaMask Popup Mockup -->
  <rect x="390" y="40" width="360" height="370" rx="16" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Popup header -->
  <rect x="390" y="40" width="360" height="56" rx="16" fill="white" fill-opacity="0.15"/>
  <rect x="390" y="80" width="360" height="16" fill="white" fill-opacity="0.15"/>
  <!-- Fox icon (simplified) -->
  <circle cx="420" cy="68" r="16" fill="#f6851b"/>
  <text x="420" y="74" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">M</text>
  <text x="446" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="white">MetaMask</text>

  <!-- Wallet address bar -->
  <rect x="406" y="108" width="328" height="32" rx="8" fill="white" fill-opacity="0.1"/>
  <rect x="414" y="118" width="180" height="12" rx="6" fill="white" fill-opacity="0.4"/>
  <circle cx="700" cy="124" r="8" fill="#22c55e" fill-opacity="0.8"/>

  <!-- Balance -->
  <text x="570" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">0 ETH</text>
  <text x="570" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.6" text-anchor="middle">$0.00 USD</text>

  <!-- Action buttons -->
  <rect x="418" y="230" width="80" height="34" rx="17" fill="white" fill-opacity="0.2"/>
  <text x="458" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Send</text>
  <rect x="510" y="230" width="80" height="34" rx="17" fill="white" fill-opacity="0.2"/>
  <text x="550" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Receive</text>
  <rect x="602" y="230" width="80" height="34" rx="17" fill="white" fill-opacity="0.2"/>
  <text x="642" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">Buy</text>

  <!-- Divider -->
  <rect x="406" y="280" width="328" height="1" fill="white" fill-opacity="0.1"/>

  <!-- Asset row -->
  <circle cx="428" cy="310" r="14" fill="#627eea" fill-opacity="0.8"/>
  <text x="428" y="315" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Ξ</text>
  <rect x="452" y="302" width="100" height="10" rx="5" fill="white" fill-opacity="0.4"/>
  <rect x="452" y="318" width="60" height="8" rx="4" fill="white" fill-opacity="0.25"/>
  <rect x="650" y="305" width="70" height="10" rx="5" fill="white" fill-opacity="0.4"/>

  <!-- Left content -->
  <!-- Fox simplified graphic -->
  <polygon points="110,60 80,100 100,110 110,95 120,110 140,100" fill="white" fill-opacity="0.3"/>
  <polygon points="110,60 90,85 110,90 130,85" fill="white" fill-opacity="0.5"/>
  <circle cx="98" cy="78" r="5" fill="#fcd34d" fill-opacity="0.9"/>
  <circle cx="122" cy="78" r="5" fill="#fcd34d" fill-opacity="0.9"/>

  <!-- Title -->
  <text x="50" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="white">MetaMask</text>
  <text x="50" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="white" fill-opacity="0.9">지갑 세팅</text>
  <text x="50" y="291" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="white" fill-opacity="0.8">완전 가이드</text>

  <!-- Subtitle -->
  <text x="50" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="white" fill-opacity="0.65">설치부터 네트워크 추가까지 단계별 정리</text>

  <!-- Badge -->
  <rect x="50" y="355" width="68" height="26" rx="13" fill="white" fill-opacity="0.2"/>
  <text x="84" y="373" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">크립토</text>
</svg>
