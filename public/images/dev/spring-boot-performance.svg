<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="370 30 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#052e16"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="700" cy="-20" r="220" fill="white" fill-opacity="0.03"/>
  <circle cx="760" cy="430" r="160" fill="white" fill-opacity="0.03"/>

  <!-- Performance graph (right side) -->
  <g transform="translate(380, 60)">
    <rect width="380" height="330" rx="12" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
    <!-- Grid lines -->
    <line x1="30" y1="280" x2="355" y2="280" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="30" y1="220" x2="355" y2="220" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="30" y1="160" x2="355" y2="160" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <line x1="30" y1="100" x2="355" y2="100" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <!-- Bar chart - before optimization (red) -->
    <rect x="50" y="130" width="40" height="150" rx="4" fill="#ef4444" fill-opacity="0.7"/>
    <rect x="110" y="150" width="40" height="130" rx="4" fill="#ef4444" fill-opacity="0.7"/>
    <rect x="170" y="120" width="40" height="160" rx="4" fill="#ef4444" fill-opacity="0.7"/>
    <!-- Bar chart - after optimization (green) -->
    <rect x="60" y="230" width="40" height="50" rx="4" fill="#4ade80" fill-opacity="0.9"/>
    <rect x="120" y="240" width="40" height="40" rx="4" fill="#4ade80" fill-opacity="0.9"/>
    <rect x="180" y="220" width="40" height="60" rx="4" fill="#4ade80" fill-opacity="0.9"/>
    <!-- Arrow down -->
    <text x="270" y="170" font-family="Arial" font-size="40" fill="#4ade80" fill-opacity="0.8">↓</text>
    <text x="258" y="210" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="#4ade80">72%</text>
    <!-- Labels -->
    <text x="195" y="310" font-family="Arial" font-size="11" fill="white" fill-opacity="0.4" text-anchor="middle">최적화 전 → 후</text>
  </g>

  <!-- Spring leaf icon (simplified) -->
  <g transform="translate(50, 60)">
    <ellipse cx="50" cy="50" rx="45" ry="25" fill="#4ade80" fill-opacity="0.2" transform="rotate(-30, 50, 50)"/>
    <ellipse cx="50" cy="50" rx="45" ry="25" fill="#4ade80" fill-opacity="0.15" transform="rotate(30, 50, 50)"/>
    <circle cx="50" cy="50" r="8" fill="#4ade80" fill-opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="50" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="white">Spring Boot</text>
  <text x="50" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="#4ade80">성능 최적화</text>
  <text x="50" y="296" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="white" fill-opacity="0.85">디버깅 가이드</text>

  <text x="50" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="white" fill-opacity="0.5">느려졌을 때 바로 확인할 5가지</text>

  <rect x="50" y="362" width="80" height="26" rx="13" fill="white" fill-opacity="0.12"/>
  <text x="90" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">개발</text>
</svg>
