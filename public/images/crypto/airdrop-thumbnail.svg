<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="coin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="coin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="coin3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="120" cy="60" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="20" r="2" fill="white" opacity="0.5"/>
  <circle cx="350" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="500" cy="25" r="1" fill="white" opacity="0.4"/>
  <circle cx="620" cy="50" r="2" fill="white" opacity="0.5"/>
  <circle cx="720" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="780" cy="70" r="1" fill="white" opacity="0.4"/>
  <circle cx="680" cy="15" r="1.5" fill="white" opacity="0.5"/>

  <!-- Parachute -->
  <ellipse cx="400" cy="95" rx="70" ry="30" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.9"/>
  <path d="M 330 95 Q 360 130 400 140 Q 440 130 470 95" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.9"/>
  <!-- Parachute lines -->
  <line x1="360" y1="120" x2="385" y2="155" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="400" y1="130" x2="400" y2="155" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="440" y1="120" x2="415" y2="155" stroke="#818cf8" stroke-width="1.5" opacity="0.7"/>
  <!-- Inner parachute stripes -->
  <path d="M 345 88 Q 365 125 400 140" fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.5"/>
  <path d="M 455 88 Q 435 125 400 140" fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.5"/>

  <!-- Coin box hanging from parachute -->
  <rect x="375" y="155" width="50" height="40" rx="8" fill="#1e3a5f" stroke="#fbbf24" stroke-width="2"/>
  <text x="400" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#fbbf24" font-weight="bold">$</text>

  <!-- Falling coins -->
  <!-- Coin 1 -->
  <circle cx="180" cy="200" r="24" fill="url(#coin1)" filter="url(#glow)"/>
  <circle cx="180" cy="200" r="20" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.6"/>
  <text x="180" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#78350f" font-weight="bold">ETH</text>

  <!-- Coin 2 -->
  <circle cx="280" cy="270" r="20" fill="url(#coin2)" filter="url(#glow)"/>
  <circle cx="280" cy="270" r="16" fill="none" stroke="#c7d2fe" stroke-width="2" opacity="0.6"/>
  <text x="280" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">SOL</text>

  <!-- Coin 3 -->
  <circle cx="550" cy="220" r="22" fill="url(#coin3)" filter="url(#glow)"/>
  <circle cx="550" cy="220" r="18" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.6"/>
  <text x="550" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#064e3b" font-weight="bold">ARB</text>

  <!-- Coin 4 -->
  <circle cx="640" cy="290" r="18" fill="#f97316" filter="url(#glow)"/>
  <circle cx="640" cy="290" r="14" fill="none" stroke="#fed7aa" stroke-width="2" opacity="0.6"/>
  <text x="640" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">OP</text>

  <!-- Coin 5 small -->
  <circle cx="150" cy="310" r="14" fill="#ec4899" filter="url(#glow)"/>
  <text x="150" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">ZK</text>

  <!-- Coin 6 small -->
  <circle cx="680" cy="180" r="16" fill="#06b6d4" filter="url(#glow)"/>
  <text x="680" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">WLD</text>

  <!-- Motion lines for falling coins -->
  <line x1="180" y1="150" x2="180" y2="172" stroke="#fbbf24" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="550" y1="170" x2="550" y2="194" stroke="#34d399" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="640" y1="240" x2="640" y2="268" stroke="#f97316" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- Wallet at the bottom -->
  <rect x="340" y="315" width="120" height="55" rx="10" fill="#1e3a5f" stroke="#818cf8" stroke-width="2"/>
  <rect x="350" y="305" width="100" height="20" rx="6" fill="#2d4a7a" stroke="#818cf8" stroke-width="1.5"/>
  <!-- Wallet shine -->
  <rect x="350" y="330" width="100" height="3" rx="1" fill="#a5b4fc" opacity="0.3"/>
  <text x="400" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc">내 지갑</text>
  <text x="400" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6366f1">0x3f...a8b2</text>

  <!-- Main text -->
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c7d2fe" font-weight="bold" letter-spacing="2">에어드랍 — 공짜 코인의 세계</text>
</svg>
