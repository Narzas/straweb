<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280">
  <defs>
    <linearGradient id="bcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bcBlock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#3730a3"/>
    </linearGradient>
  </defs>

  <rect width="700" height="280" fill="url(#bcBg)" rx="16"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="bold">블록체인 = 블록을 시간순으로 연결한 장부</text>

  <!-- 4 blocks with arrows -->
  <g>
    <!-- Block 1 -->
    <rect x="40" y="65" width="130" height="150" rx="10" fill="url(#bcBlock)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="40" y="65" width="130" height="28" rx="10" fill="#6366f1"/>
    <rect x="40" y="83" width="130" height="10" fill="#6366f1"/>
    <text x="105" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Block #1</text>

    <text x="55" y="115" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Prev hash:</text>
    <text x="55" y="128" font-family="Courier, monospace" font-size="9" fill="#818cf8">0000...</text>

    <text x="55" y="148" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Transactions:</text>
    <rect x="55" y="155" width="100" height="11" rx="3" fill="#312e81"/>
    <text x="58" y="164" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe">A → B  $50</text>
    <rect x="55" y="170" width="100" height="11" rx="3" fill="#312e81"/>
    <text x="58" y="179" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe">C → D  $120</text>

    <text x="55" y="198" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Hash: <tspan fill="#fbbf24">a3f1...</tspan></text>

    <!-- Arrow 1 -->
    <line x1="170" y1="140" x2="195" y2="140" stroke="#a78bfa" stroke-width="2"/>
    <polygon points="195,135 205,140 195,145" fill="#a78bfa"/>

    <!-- Block 2 -->
    <rect x="205" y="65" width="130" height="150" rx="10" fill="url(#bcBlock)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="205" y="65" width="130" height="28" rx="10" fill="#6366f1"/>
    <rect x="205" y="83" width="130" height="10" fill="#6366f1"/>
    <text x="270" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Block #2</text>

    <text x="220" y="115" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Prev hash:</text>
    <text x="220" y="128" font-family="Courier, monospace" font-size="9" fill="#fbbf24">a3f1...</text>

    <text x="220" y="148" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Transactions:</text>
    <rect x="220" y="155" width="100" height="11" rx="3" fill="#312e81"/>
    <text x="223" y="164" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe">E → F  $30</text>
    <rect x="220" y="170" width="100" height="11" rx="3" fill="#312e81"/>
    <text x="223" y="179" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe">G → H  $200</text>

    <text x="220" y="198" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Hash: <tspan fill="#fbbf24">b8d2...</tspan></text>

    <!-- Arrow 2 -->
    <line x1="335" y1="140" x2="360" y2="140" stroke="#a78bfa" stroke-width="2"/>
    <polygon points="360,135 370,140 360,145" fill="#a78bfa"/>

    <!-- Block 3 -->
    <rect x="370" y="65" width="130" height="150" rx="10" fill="url(#bcBlock)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="370" y="65" width="130" height="28" rx="10" fill="#6366f1"/>
    <rect x="370" y="83" width="130" height="10" fill="#6366f1"/>
    <text x="435" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Block #3</text>

    <text x="385" y="115" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Prev hash:</text>
    <text x="385" y="128" font-family="Courier, monospace" font-size="9" fill="#fbbf24">b8d2...</text>

    <text x="385" y="148" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Transactions:</text>
    <rect x="385" y="155" width="100" height="11" rx="3" fill="#312e81"/>
    <text x="388" y="164" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe">I → J  $15</text>
    <rect x="385" y="170" width="100" height="11" rx="3" fill="#312e81"/>
    <text x="388" y="179" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe">K → L  $90</text>

    <text x="385" y="198" font-family="Arial, sans-serif" font-size="9" fill="#a5b4fc">Hash: <tspan fill="#fbbf24">c5e9...</tspan></text>

    <!-- Arrow 3 -->
    <line x1="500" y1="140" x2="525" y2="140" stroke="#a78bfa" stroke-width="2"/>
    <polygon points="525,135 535,140 525,145" fill="#a78bfa"/>

    <!-- Block 4 (NEW) -->
    <rect x="535" y="65" width="130" height="150" rx="10" fill="url(#bcBlock)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="535" y="65" width="130" height="28" rx="10" fill="#f59e0b"/>
    <rect x="535" y="83" width="130" height="10" fill="#f59e0b"/>
    <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Block #4 NEW</text>

    <text x="550" y="115" font-family="Arial, sans-serif" font-size="9" fill="#fcd34d">Prev hash:</text>
    <text x="550" y="128" font-family="Courier, monospace" font-size="9" fill="#fbbf24">c5e9...</text>

    <text x="550" y="148" font-family="Arial, sans-serif" font-size="9" fill="#fcd34d">새 거래 묶음</text>
    <rect x="550" y="155" width="100" height="11" rx="3" fill="#451a03"/>
    <text x="553" y="164" font-family="Arial, sans-serif" font-size="8" fill="#fde68a">M → N  $77</text>
    <rect x="550" y="170" width="100" height="11" rx="3" fill="#451a03"/>
    <text x="553" y="179" font-family="Arial, sans-serif" font-size="8" fill="#fde68a">검증 중...</text>

    <text x="550" y="198" font-family="Arial, sans-serif" font-size="9" fill="#fcd34d">합의 후 추가</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc">각 블록은 이전 블록 해시를 포함 → 한 블록을 위변조하면 그 이후 모든 블록이 깨짐</text>
  <text x="350" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">이게 "체인"이라고 부르는 이유다</text>
</svg>
