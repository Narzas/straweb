<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <defs>
    <linearGradient id="ammBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="700" height="320" fill="url(#ammBg)" rx="16"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="bold">AMM 곡선 — 거래할수록 가격이 자동으로 움직인다</text>

  <!-- Coordinate system -->
  <g transform="translate(80, 60)">
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="white" stroke-opacity="0.4" stroke-width="1.5"/>
    <polygon points="0,-2 -4,8 4,8" fill="white" fill-opacity="0.4"/>
    <text x="-32" y="6" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc" font-weight="bold">ETH</text>

    <!-- X-axis -->
    <line x1="0" y1="200" x2="380" y2="200" stroke="white" stroke-opacity="0.4" stroke-width="1.5"/>
    <polygon points="382,200 372,196 372,204" fill="white" fill-opacity="0.4"/>
    <text x="386" y="206" font-family="Arial, sans-serif" font-size="11" fill="#a5b4fc" font-weight="bold">USDC</text>

    <!-- Grid (subtle) -->
    <g stroke="white" stroke-opacity="0.06">
      <line x1="0" y1="50" x2="380" y2="50" stroke-width="0.5"/>
      <line x1="0" y1="100" x2="380" y2="100" stroke-width="0.5"/>
      <line x1="0" y1="150" x2="380" y2="150" stroke-width="0.5"/>
      <line x1="100" y1="0" x2="100" y2="200" stroke-width="0.5"/>
      <line x1="200" y1="0" x2="200" y2="200" stroke-width="0.5"/>
      <line x1="300" y1="0" x2="300" y2="200" stroke-width="0.5"/>
    </g>

    <!-- Hyperbola xy=k -->
    <path d="M 18,12 Q 40,28 60,52 Q 90,90 130,130 Q 175,165 230,180 Q 290,190 360,194"
          stroke="#fbbf24" stroke-width="3" fill="none"/>

    <!-- Point A: before swap -->
    <circle cx="80" cy="80" r="6" fill="#22d3ee" stroke="white" stroke-width="2"/>
    <line x1="0" y1="80" x2="80" y2="80" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="80" y1="80" x2="80" y2="200" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="-58" y="84" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee">1,000 ETH</text>
    <text x="58" y="216" font-family="Arial, sans-serif" font-size="10" fill="#22d3ee">2M USDC</text>
    <text x="92" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">A</text>

    <!-- Point B: after swap -->
    <circle cx="200" cy="135" r="6" fill="#a78bfa" stroke="white" stroke-width="2"/>
    <line x1="0" y1="135" x2="200" y2="135" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="200" y1="135" x2="200" y2="200" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="-58" y="139" font-family="Arial, sans-serif" font-size="10" fill="#a78bfa">800 ETH</text>
    <text x="178" y="216" font-family="Arial, sans-serif" font-size="10" fill="#a78bfa">2.5M USDC</text>
    <text x="212" y="131" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">B</text>

    <!-- Arrow A → B -->
    <path d="M 88,86 Q 140,110 192,128" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
    <polygon points="192,128 184,127 188,135" fill="#fbbf24"/>

    <!-- Formula box -->
    <g transform="translate(265, 18)">
      <rect x="0" y="0" width="115" height="48" rx="8" fill="white" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1"/>
      <text x="57" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#fbbf24">x · y = k</text>
      <text x="57" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" fill-opacity="0.7">(상수곱 유지)</text>
    </g>
  </g>

  <!-- Bottom annotation: trade explanation -->
  <g transform="translate(60, 280)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e1">
      <tspan fill="#22d3ee" font-weight="bold">A → B:</tspan> 누군가 USDC 500K를 풀에 넣고 ETH 200개를 가져갔다 →
      <tspan fill="#fbbf24" font-weight="bold">곱 k = 2,000,000,000은 그대로</tspan>, 풀의 ETH 가격만 자동 상승
    </text>
  </g>
</svg>
