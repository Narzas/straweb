<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0a0820"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#3730a3"/>
    </linearGradient>
    <linearGradient id="screen-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0c1a3a"/>
      <stop offset="100%" style="stop-color:#162040"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="390" fill="url(#bg)"/>
  <rect width="390" height="390" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="40"  cy="30"  r="1.2" fill="white" opacity="0.4"/>
  <circle cx="340" cy="50"  r="1"   fill="white" opacity="0.35"/>
  <circle cx="360" cy="20"  r="1.5" fill="white" opacity="0.5"/>
  <circle cx="20"  cy="120" r="1"   fill="white" opacity="0.3"/>
  <circle cx="370" cy="140" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="60"  cy="310" r="1"   fill="white" opacity="0.3"/>
  <circle cx="330" cy="330" r="1.2" fill="white" opacity="0.35"/>

  <!-- ── GBA SP 스타일 클램쉘 디바이스 ── -->

  <!-- 상단 스크린 파트 -->
  <rect x="118" y="50" width="154" height="118" rx="12" fill="url(#body)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- 스크린 베젤 -->
  <rect x="128" y="59" width="134" height="100" rx="7" fill="#080c1a"/>
  <!-- 스크린 -->
  <rect x="134" y="65" width="122" height="88" rx="4" fill="url(#screen-bg)"/>

  <!-- 스크린 내용: 픽셀 게임 씬 -->
  <!-- 하늘 -->
  <rect x="134" y="65" width="122" height="30" rx="4" fill="#0f3460" fill-opacity="0.8"/>
  <!-- 구름 -->
  <ellipse cx="158" cy="76" rx="12" ry="6" fill="white" fill-opacity="0.15"/>
  <ellipse cx="218" cy="80" rx="9"  ry="5" fill="white" fill-opacity="0.12"/>
  <!-- 땅 -->
  <rect x="134" y="120" width="122" height="33" rx="0" fill="#1a472a" fill-opacity="0.7"/>
  <rect x="134" y="148" width="122" height="5" rx="0" fill="#14532d" fill-opacity="0.9"/>
  <!-- 캐릭터 (간단한 픽셀) -->
  <rect x="176" y="108" width="8"  height="12" rx="1" fill="#fbbf24" fill-opacity="0.9"/>
  <rect x="174" y="120" width="12" height="5"  rx="1" fill="#1d4ed8" fill-opacity="0.9"/>
  <!-- 코인 -->
  <circle cx="210" cy="113" r="5" fill="#fbbf24" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1"/>
  <text x="210" y="117" font-family="Arial" font-size="6" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
  <!-- 스크린 글로우 -->
  <rect x="134" y="65" width="122" height="88" rx="4" fill="white" fill-opacity="0.03"/>
  <!-- 전원 LED -->
  <circle cx="238" cy="164" r="3" fill="#4ade80" fill-opacity="0.9"/>

  <!-- 힌지 영역 -->
  <rect x="148" y="166" width="94" height="14" rx="5" fill="#312e81" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="163" cy="173" r="3.5" fill="#3730a3" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="227" cy="173" r="3.5" fill="#3730a3" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>

  <!-- 하단 컨트롤 파트 -->
  <rect x="108" y="178" width="174" height="96" rx="12" fill="url(#body)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- 숄더 버튼 L/R -->
  <rect x="108" y="178" width="30" height="10" rx="5" fill="#4338ca" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="252" y="178" width="30" height="10" rx="5" fill="#4338ca" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- D-패드 -->
  <rect x="132" y="202" width="8"  height="26" rx="3" fill="#1e1b4b"/>
  <rect x="124" y="210" width="24" height="8"  rx="3" fill="#1e1b4b"/>
  <!-- 십자 중심 -->
  <circle cx="140" cy="215" r="4" fill="#312e81"/>

  <!-- ABXY 버튼 -->
  <circle cx="240" cy="205" r="7" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="255" cy="218" r="7" fill="#22c55e" fill-opacity="0.85"/>
  <circle cx="225" cy="218" r="7" fill="#3b82f6" fill-opacity="0.85"/>
  <circle cx="240" cy="231" r="7" fill="#eab308" fill-opacity="0.85"/>
  <text x="240" y="209" font-family="Arial" font-size="8" font-weight="bold" fill="white" fill-opacity="0.8" text-anchor="middle">A</text>
  <text x="255" y="222" font-family="Arial" font-size="8" font-weight="bold" fill="white" fill-opacity="0.8" text-anchor="middle">B</text>
  <text x="225" y="222" font-family="Arial" font-size="8" font-weight="bold" fill="white" fill-opacity="0.8" text-anchor="middle">X</text>
  <text x="240" y="235" font-family="Arial" font-size="8" font-weight="bold" fill="white" fill-opacity="0.8" text-anchor="middle">Y</text>

  <!-- SELECT / START -->
  <rect x="172" y="252" width="18" height="6" rx="3" fill="#312e81"/>
  <rect x="196" y="252" width="18" height="6" rx="3" fill="#312e81"/>
  <text x="181" y="262" font-family="Arial" font-size="6" fill="#818cf8" fill-opacity="0.7" text-anchor="middle">SEL</text>
  <text x="205" y="262" font-family="Arial" font-size="6" fill="#818cf8" fill-opacity="0.7" text-anchor="middle">STA</text>

  <!-- ── 텍스트 ── -->
  <text x="195" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" fill-opacity="0.9" letter-spacing="2" text-anchor="middle">ANBERNIC</text>
  <text x="195" y="328" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="white" text-anchor="middle">RG34XX SP</text>
  <text x="195" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#c7d2fe" fill-opacity="0.75" text-anchor="middle">한 달 써본 솔직 후기</text>

  <!-- 배지 -->
  <rect x="155" y="362" width="80" height="24" rx="12" fill="#4338ca" fill-opacity="0.35" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="195" y="379" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">리뷰</text>
</svg>
