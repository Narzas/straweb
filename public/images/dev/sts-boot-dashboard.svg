<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
  <defs>
    <linearGradient id="bdbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="540" fill="url(#bdbg)"/>

  <text x="500" y="50" font-family="'Segoe UI', Arial" font-size="22" font-weight="800" fill="white" text-anchor="middle">Boot Dashboard — STS의 진짜 핵심 기능</text>

  <!-- Window -->
  <g transform="translate(80, 96)">
    <rect width="840" height="380" rx="10" fill="#1e293b" stroke="white" stroke-opacity="0.12"/>

    <!-- Tab header -->
    <rect width="840" height="32" rx="10" fill="#0b1220"/>
    <rect y="22" width="840" height="10" fill="#0b1220"/>
    <rect x="14" y="6" width="140" height="22" rx="3" fill="#1e293b"/>
    <circle cx="28" cy="17" r="5" fill="#22c55e"/>
    <text x="44" y="21" font-family="'Segoe UI', Arial" font-size="11" font-weight="700" fill="white">Boot Dashboard</text>

    <!-- Toolbar -->
    <g transform="translate(14, 42)">
      <rect width="28" height="22" rx="3" fill="#22c55e" fill-opacity="0.2"/>
      <path d="M 12 8 L 12 18 L 22 13 Z" fill="#22c55e"/>
      <rect x="34" width="28" height="22" rx="3" fill="white" fill-opacity="0.06"/>
      <rect x="44" y="8" width="8" height="8" fill="#ef4444" fill-opacity="0.8"/>
      <rect x="68" width="28" height="22" rx="3" fill="white" fill-opacity="0.06"/>
      <path d="M 78 8 L 78 18 L 88 13 Z" fill="#fbbf24" fill-opacity="0.8"/>
      <text x="84" y="17" font-family="'Segoe UI', Arial" font-size="9" fill="#0a1628" font-weight="800">D</text>
      <rect x="102" width="28" height="22" rx="3" fill="white" fill-opacity="0.06"/>
      <circle cx="116" cy="13" r="6" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
      <path d="M 113 13 L 119 13" stroke="#60a5fa" stroke-width="1.6"/>
    </g>

    <!-- Project rows -->
    <g transform="translate(20, 86)">
      <!-- Header -->
      <text x="0" y="14" font-family="'Segoe UI', Arial" font-size="11" font-weight="700" fill="white" fill-opacity="0.5" letter-spacing="1">▾ LOCAL</text>

      <!-- Row 1: Running -->
      <g transform="translate(0, 30)">
        <rect width="800" height="46" rx="5" fill="white" fill-opacity="0.05"/>
        <rect x="14" y="14" width="18" height="18" rx="4" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1"/>
        <circle cx="23" cy="23" r="3" fill="#22c55e"/>
        <text x="46" y="28" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="white">my-spring-app</text>
        <rect x="200" y="16" width="60" height="18" rx="9" fill="#22c55e" fill-opacity="0.18"/>
        <text x="230" y="29" font-family="'Segoe UI', Arial" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">RUNNING</text>
        <text x="280" y="28" font-family="'Consolas', monospace" font-size="11" fill="white" fill-opacity="0.5">localhost:8080  ·  PID 12944</text>
        <g transform="translate(720, 12)">
          <rect width="22" height="22" rx="3" fill="#ef4444" fill-opacity="0.15"/>
          <rect x="7" y="7" width="8" height="8" fill="#ef4444"/>
          <rect x="28" width="22" height="22" rx="3" fill="#fbbf24" fill-opacity="0.15"/>
          <text x="39" y="17" font-family="'Segoe UI', Arial" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">↻</text>
        </g>
      </g>

      <!-- Row 2: Stopped -->
      <g transform="translate(0, 86)">
        <rect width="800" height="46" rx="5" fill="white" fill-opacity="0.025"/>
        <rect x="14" y="14" width="18" height="18" rx="4" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
        <text x="46" y="28" font-family="'Segoe UI', Arial" font-size="13" fill="white" fill-opacity="0.7">batch-job</text>
        <rect x="200" y="16" width="60" height="18" rx="9" fill="white" fill-opacity="0.06"/>
        <text x="230" y="29" font-family="'Segoe UI', Arial" font-size="10" font-weight="700" fill="white" fill-opacity="0.5" text-anchor="middle">STOPPED</text>
        <text x="280" y="28" font-family="'Consolas', monospace" font-size="11" fill="white" fill-opacity="0.4">port 8081</text>
      </g>

      <!-- Row 3: Debugging -->
      <g transform="translate(0, 142)">
        <rect width="800" height="46" rx="5" fill="white" fill-opacity="0.05"/>
        <rect x="14" y="14" width="18" height="18" rx="4" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1"/>
        <text x="23" y="27" font-family="'Segoe UI', Arial" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">D</text>
        <text x="46" y="28" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="white">api-gateway</text>
        <rect x="200" y="16" width="80" height="18" rx="9" fill="#fbbf24" fill-opacity="0.18"/>
        <text x="240" y="29" font-family="'Segoe UI', Arial" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">DEBUGGING</text>
        <text x="294" y="28" font-family="'Consolas', monospace" font-size="11" fill="white" fill-opacity="0.5">localhost:9000  ·  PID 7822</text>
      </g>
    </g>
  </g>

  <!-- Caption -->
  <text x="500" y="510" font-family="'Segoe UI', Arial" font-size="13" fill="white" fill-opacity="0.55" text-anchor="middle">앱별 Run / Debug / Stop / Restart 한 번에. IntelliJ Run 버튼이랑 같은 역할입니다.</text>
</svg>
