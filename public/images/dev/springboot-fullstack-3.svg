<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0d0a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="680" cy="-20" r="240" fill="white" fill-opacity="0.02"/>
  <circle cx="740" cy="460" r="170" fill="white" fill-opacity="0.02"/>

  <!-- Right panel: CRUD flow -->
  <g transform="translate(400, 50)">
    <rect width="360" height="340" rx="14" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08" stroke-width="1"/>

    <!-- MyBatis mapper mockup -->
    <text x="24" y="44" font-family="'Courier New', monospace" font-size="11" fill="white" fill-opacity="0.4">UserMapper.xml</text>
    <rect x="24" y="52" width="312" height="160" rx="6" fill="black" fill-opacity="0.25"/>
    <text x="36" y="72" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">&lt;select id="findAll"&gt;</text>
    <text x="48" y="88" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.7">SELECT * FROM users</text>
    <text x="36" y="104" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">&lt;/select&gt;</text>
    <text x="36" y="124" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">&lt;insert id="insert"&gt;</text>
    <text x="48" y="140" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.7">INSERT INTO users VALUES</text>
    <text x="48" y="156" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.7">(#&#123;id&#125;, #&#123;name&#125;, #&#123;email&#125;)</text>
    <text x="36" y="172" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">&lt;/insert&gt;</text>
    <text x="36" y="192" font-family="'Courier New', monospace" font-size="10" fill="white" fill-opacity="0.3">  ...</text>

    <!-- CRUD badges -->
    <text x="24" y="240" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.4">REST API Endpoints</text>
    <rect x="24" y="250" width="64" height="26" rx="6" fill="#22c55e" fill-opacity="0.25" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
    <text x="56" y="268" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">GET</text>
    <rect x="98" y="250" width="64" height="26" rx="6" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="130" y="268" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">POST</text>
    <rect x="172" y="250" width="64" height="26" rx="6" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <text x="204" y="268" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#fcd34d" text-anchor="middle">PUT</text>
    <rect x="246" y="250" width="72" height="26" rx="6" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
    <text x="282" y="268" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">DELETE</text>

    <!-- flow: Controller → Service → Mapper → DB -->
    <text x="24" y="314" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.4">레이어 구조</text>
    <text x="24" y="334" font-family="'Segoe UI', Arial" font-size="12" fill="white" fill-opacity="0.8">Controller → Service → Mapper → DB</text>

    <rect x="298" y="320" width="36" height="24" rx="12" fill="#a5b4fc" fill-opacity="0.2" stroke="#a5b4fc" stroke-opacity="0.4" stroke-width="1"/>
    <text x="316" y="337" font-family="'Segoe UI', Arial" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">3/4</text>
  </g>

  <!-- Spring leaf (indigo tint) -->
  <g transform="translate(46, 52)">
    <ellipse cx="44" cy="44" rx="40" ry="22" fill="#818cf8" fill-opacity="0.18" transform="rotate(-30, 44, 44)"/>
    <ellipse cx="44" cy="44" rx="40" ry="22" fill="#818cf8" fill-opacity="0.12" transform="rotate(30, 44, 44)"/>
    <circle cx="44" cy="44" r="7" fill="#a5b4fc" fill-opacity="0.45"/>
  </g>

  <text x="50" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" fill-opacity="0.9" letter-spacing="2">SPRING BOOT SERIES</text>
  <text x="50" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="white">MyBatis 설정</text>
  <text x="50" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#a5b4fc">&amp; CRUD API</text>
  <text x="50" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.55">Mapper · XML · REST Controller</text>

  <rect x="50" y="345" width="72" height="26" rx="13" fill="white" fill-opacity="0.1"/>
  <text x="86" y="363" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">개발</text>
</svg>
