  <text x="420" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Base</text>
  <text x="530" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">낮음</text>
  <text x="610" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">빠름</text>
  <text x="690" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">에어드랍</text>

