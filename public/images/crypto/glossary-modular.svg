<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="modBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </linearGradient>
    <linearGradient id="exGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="conGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <linearGradient id="daGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
  </defs>

  <rect width="700" height="380" fill="url(#modBg)" rx="16"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="bold">모놀리식(통합형) vs 모듈러(분리형) 블록체인</text>

  <!-- Left: Monolithic -->
  <g>
    <text x="170" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fca5a5" font-weight="bold">모놀리식 (전통 방식)</text>
    <text x="170" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fecaca">한 체인이 모든 일 다 함</text>

    <rect x="50" y="115" width="240" height="220" rx="14" fill="url(#monoGrad)" stroke="#f87171" stroke-width="1.5"/>
    <text x="170" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">한 블록체인이 모두 처리</text>

    <!-- Stacked layers inside -->
    <rect x="70" y="160" width="200" height="36" rx="6" fill="#991b1b" stroke="#fca5a5" stroke-width="1"/>
    <text x="170" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">실행 (Execution)</text>

    <rect x="70" y="202" width="200" height="36" rx="6" fill="#991b1b" stroke="#fca5a5" stroke-width="1"/>
    <text x="170" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">합의 (Consensus)</text>

    <rect x="70" y="244" width="200" height="36" rx="6" fill="#991b1b" stroke="#fca5a5" stroke-width="1"/>
    <text x="170" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">데이터 가용성 (DA)</text>

    <rect x="70" y="286" width="200" height="36" rx="6" fill="#991b1b" stroke="#fca5a5" stroke-width="1"/>
    <text x="170" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">결제 (Settlement)</text>

    <text x="170" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fca5a5">예) 비트코인, 솔라나</text>
  </g>

  <!-- VS divider -->
  <g>
    <line x1="320" y1="120" x2="320" y2="330" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="320" cy="225" r="22" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="320" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">VS</text>
  </g>

  <!-- Right: Modular -->
  <g>
    <text x="500" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#67e8f9" font-weight="bold">모듈러 (분리 방식)</text>
    <text x="500" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a5f3fc">각 레이어가 자기 역할만</text>

    <!-- Execution layer (L2) -->
    <rect x="350" y="115" width="290" height="50" rx="8" fill="url(#exGrad)" stroke="#67e8f9" stroke-width="1"/>
    <text x="495" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">실행 — L2 Rollup</text>
    <text x="495" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#cffafe">Base · Arbitrum · zkSync</text>

    <!-- Arrow down -->
    <line x1="495" y1="167" x2="495" y2="183" stroke="#a78bfa" stroke-width="1.5"/>
    <polygon points="491,179 495,189 499,179" fill="#a78bfa"/>

    <!-- DA layer -->
    <rect x="350" y="190" width="140" height="50" rx="8" fill="url(#daGrad)" stroke="#fcd34d" stroke-width="1"/>
    <text x="420" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">데이터 가용성</text>
    <text x="420" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7">Celestia · EigenDA</text>

    <!-- Consensus layer -->
    <rect x="500" y="190" width="140" height="50" rx="8" fill="url(#conGrad)" stroke="#c084fc" stroke-width="1"/>
    <text x="570" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">합의·결제</text>
    <text x="570" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e9d5ff">Ethereum L1</text>

    <!-- Bottom note for modular -->
    <text x="495" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e1">각 레이어 분리 = 더 빠르고 저렴, 자유로운 조합</text>

    <!-- Pros -->
    <g>
      <rect x="365" y="285" width="65" height="22" rx="6" fill="#0c4a6e"/>
      <text x="397" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7dd3fc">고속</text>

      <rect x="440" y="285" width="65" height="22" rx="6" fill="#0c4a6e"/>
      <text x="472" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7dd3fc">저비용</text>

      <rect x="515" y="285" width="65" height="22" rx="6" fill="#0c4a6e"/>
      <text x="547" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7dd3fc">유연</text>

      <rect x="590" y="285" width="50" height="22" rx="6" fill="#0c4a6e"/>
      <text x="615" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7dd3fc">확장성</text>
    </g>

    <text x="500" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#67e8f9">2024~2026 메이저 트렌드</text>
  </g>

  <!-- Bottom note -->
  <text x="350" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">* 모듈러는 각 레이어가 따로 발전 가능 — 컴퓨터 부품 갈아 끼우듯 조합</text>
</svg>
