<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
  <defs>
    <linearGradient id="ilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="holdBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <linearGradient id="lpBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="initBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
  </defs>

  <rect width="700" height="340" fill="url(#ilBg)" rx="16"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="bold">임퍼머넌트 로스 (IL) — LP가 그냥 들고 있을 때보다 손해 보는 이유</text>

  <!-- Scenario header -->
  <text x="350" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">초기 자산: ETH 1개 + USDC $2,000  ·  ETH 가격 $2,000 → $4,000 (2배 상승)</text>

  <!-- Initial state bar -->
  <g transform="translate(60, 100)">
    <text x="60" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#cbd5e1">초기 (ETH = $2,000)</text>
    <rect x="0" y="20" width="120" height="160" rx="6" fill="url(#initBar)"/>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ETH 1개</text>
    <text x="60" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.85">+ $2,000 USDC</text>
    <text x="60" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">$4,000</text>

    <!-- Arrow -->
    <line x1="135" y1="100" x2="195" y2="100" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="195,95 205,100 195,105" fill="#fbbf24"/>
    <text x="165" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fbbf24">시간 흐름</text>
  </g>

  <!-- HODL scenario -->
  <g transform="translate(290, 100)">
    <!-- Bar (taller = more value) -->
    <rect x="20" y="-60" width="120" height="240" rx="6" fill="url(#holdBar)"/>
    <!-- Header above bar -->
    <text x="80" y="-72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#86efac">그냥 들고 있기 (HODL)</text>
    <text x="80" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ETH 1개</text>
    <text x="80" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">($4,000)</text>
    <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">+ $2,000</text>
    <text x="80" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">USDC</text>
    <text x="80" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24">$6,000</text>
  </g>

  <!-- LP scenario -->
  <g transform="translate(510, 100)">
    <!-- Bar (slightly shorter) -->
    <rect x="20" y="-40" width="120" height="220" rx="6" fill="url(#lpBar)"/>
    <!-- Header above bar -->
    <text x="80" y="-72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c4b5fd">LP 풀에 예치</text>
    <text x="80" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ETH 0.71개</text>
    <text x="80" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">($2,830)</text>
    <text x="80" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">+ $2,830</text>
    <text x="80" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.9">USDC</text>
    <text x="80" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">$5,660</text>
  </g>

  <!-- IL annotation -->
  <g transform="translate(380, 295)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.2"/>
    <text x="140" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">IL = $6,000 - $5,660 = -$340 손해</text>
  </g>

  <!-- Bottom note -->
  <text x="40" y="316" font-family="Arial, sans-serif" font-size="10" fill="#64748b">풀에 넣은 ETH는 가격이 오를수록 자동으로 USDC로 팔려나간다 — 그래서 그냥 들고 있던 것보다 적게 됨</text>
</svg>
