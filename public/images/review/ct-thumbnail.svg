<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0c1a3a"/>
    </linearGradient>
    <linearGradient id="portal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="sword" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="portal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.6"/>
      <stop offset="60%" style="stop-color:#6d28d9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="390" fill="url(#bg)"/>
  <rect width="390" height="390" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="35"  cy="25"  r="1.2" fill="white" opacity="0.5"/>
  <circle cx="355" cy="40"  r="1"   fill="white" opacity="0.4"/>
  <circle cx="370" cy="15"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="15"  cy="110" r="1"   fill="white" opacity="0.35"/>
  <circle cx="375" cy="130" r="1.2" fill="white" opacity="0.45"/>
  <circle cx="50"  cy="290" r="1"   fill="white" opacity="0.3"/>
  <circle cx="340" cy="310" r="1.3" fill="white" opacity="0.4"/>
  <circle cx="80"  cy="50"  r="0.8" fill="white" opacity="0.3"/>
  <circle cx="310" cy="75"  r="1"   fill="white" opacity="0.35"/>
  <circle cx="20"  cy="200" r="1.2" fill="white" opacity="0.4"/>

  <!-- Time portal / gate (center-top area) -->
  <ellipse cx="195" cy="155" rx="72" ry="72" fill="url(#portal-glow)"/>
  <ellipse cx="195" cy="155" rx="62" ry="62" fill="none" stroke="url(#portal)" stroke-width="3" opacity="0.8"/>
  <ellipse cx="195" cy="155" rx="50" ry="50" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="195" cy="155" rx="38" ry="38" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>

  <!-- Portal inner glow -->
  <ellipse cx="195" cy="155" rx="28" ry="28" fill="#4f46e5" fill-opacity="0.25"/>

  <!-- Portal swirl lines -->
  <path d="M195 93 Q227 103 237 135 Q247 167 227 187 Q207 207 175 197" stroke="#a78bfa" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
  <path d="M195 217 Q163 207 153 175 Q143 143 163 123 Q183 103 215 113" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-opacity="0.5"/>

  <!-- Clock / gear symbol inside portal -->
  <circle cx="195" cy="155" r="20" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.7"/>
  <!-- Clock hands -->
  <line x1="195" y1="155" x2="195" y2="141" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="195" y1="155" x2="205" y2="160" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Clock center -->
  <circle cx="195" cy="155" r="2.5" fill="#e2e8f0" opacity="0.9"/>
  <!-- Clock ticks -->
  <line x1="195" y1="136" x2="195" y2="139" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="195" y1="171" x2="195" y2="174" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="176" y1="155" x2="179" y2="155" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="211" y1="155" x2="214" y2="155" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Energy sparks around portal -->
  <circle cx="133" cy="122" r="3" fill="#a78bfa" fill-opacity="0.7"/>
  <circle cx="257" cy="122" r="2.5" fill="#60a5fa" fill-opacity="0.7"/>
  <circle cx="133" cy="188" r="2" fill="#60a5fa" fill-opacity="0.6"/>
  <circle cx="257" cy="188" r="3" fill="#a78bfa" fill-opacity="0.7"/>
  <circle cx="195" cy="90"  r="2.5" fill="#c4b5fd" fill-opacity="0.8"/>
  <circle cx="195" cy="220" r="2"   fill="#818cf8" fill-opacity="0.7"/>

  <!-- Sword (Masamune) - left side -->
  <rect x="75" y="100" width="5" height="75" rx="2" fill="url(#sword)" transform="rotate(-20 77 137)"/>
  <!-- Blade fuller -->
  <rect x="77" y="100" width="1.5" height="65" rx="1" fill="#cbd5e1" fill-opacity="0.6" transform="rotate(-20 77 137)"/>
  <!-- Guard -->
  <rect x="68" y="163" width="19" height="6" rx="2" fill="#f59e0b" transform="rotate(-20 77 166)"/>
  <!-- Handle -->
  <rect x="74" y="168" width="6" height="20" rx="2" fill="#92400e" transform="rotate(-20 77 178)"/>
  <!-- Pommel -->
  <circle cx="71" cy="191" r="4" fill="#f59e0b" transform="rotate(-20 77 178)"/>
  <!-- Sword glow -->
  <rect x="75" y="100" width="5" height="75" rx="2" fill="#c4b5fd" fill-opacity="0.15" transform="rotate(-20 77 137)"/>

  <!-- Lightning bolt (Crono's power) - right side -->
  <path d="M298 108 L282 142 L292 142 L276 178" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M298 108 L282 142 L292 142 L276 178" stroke="#fef3c7" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Title -->
  <text x="195" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#a78bfa" fill-opacity="0.9" letter-spacing="3" text-anchor="middle">SQUARE · SNES</text>
  <text x="195" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="900" fill="white" text-anchor="middle">크로노 트리거</text>
  <text x="195" y="324" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#c4b5fd" fill-opacity="0.8" text-anchor="middle">시간을 넘은 명작 RPG</text>

  <!-- Badge -->
  <rect x="140" y="340" width="110" height="24" rx="12" fill="#4c1d95" fill-opacity="0.4" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1"/>
  <text x="195" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd" text-anchor="middle">게임리뷰 · 명작</text>
</svg>
