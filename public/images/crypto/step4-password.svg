<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Step label -->
  <rect x="30" y="24" width="80" height="28" rx="14" fill="#f6851b"/>
  <text x="70" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">STEP 4</text>

  <text x="30" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white">비밀번호 설정</text>

  <!-- MetaMask popup -->
  <rect x="220" y="100" width="340" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <rect x="220" y="100" width="340" height="50" rx="16" fill="#1f2937"/>
  <rect x="220" y="132" width="340" height="18" fill="#1f2937"/>
  <text x="390" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">비밀번호 만들기</text>

  <!-- Password field 1 -->
  <text x="236" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#374151">새 비밀번호 (최소 8자)</text>
  <rect x="236" y="178" width="308" height="36" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="250" y="201" font-family="monospace" font-size="14" fill="#374151">●●●●●●●●●●●</text>
  <!-- Strength bar -->
  <rect x="236" y="218" width="308" height="4" rx="2" fill="#e5e7eb"/>
  <rect x="236" y="218" width="200" height="4" rx="2" fill="#22c55e"/>
  <text x="544" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#22c55e">강함</text>

  <!-- Password field 2 -->
  <text x="236" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#374151">비밀번호 확인</text>
  <rect x="236" y="250" width="308" height="36" rx="8" fill="#f9fafb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="250" y="273" font-family="monospace" font-size="14" fill="#374151">●●●●●●●●●●●</text>
  <text x="512" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#22c55e">✓</text>

  <!-- Checkbox -->
  <rect x="236" y="300" width="16" height="16" rx="4" fill="#f6851b"/>
  <text x="244" y="312" font-family="Arial" font-size="11" fill="white" text-anchor="middle">✓</text>
  <text x="260" y="312" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#374151">이용 약관에 동의합니다</text>

  <!-- Create button -->
  <rect x="236" y="328" width="308" height="44" rx="10" fill="#f6851b"/>
  <text x="390" y="355" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">지갑 만들기</text>

  <!-- Tips panel -->
  <rect x="590" y="100" width="180" height="320" rx="12" fill="#1e293b" stroke="#f6851b" stroke-width="1.5"/>
  <text x="680" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#f6851b" text-anchor="middle">비밀번호 팁</text>
  <rect x="604" y="138" width="152" height="1" fill="#334155"/>

  <text x="608" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">이 비밀번호는</text>
  <text x="608" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">이 기기에서만</text>
  <text x="608" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">MetaMask 잠금</text>
  <text x="608" y="214" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">해제에 사용됩니다</text>

  <rect x="604" y="226" width="152" height="1" fill="#334155"/>

  <text x="608" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">✅ 8자 이상</text>
  <text x="608" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">✅ 대문자 포함</text>
  <text x="608" y="288" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">✅ 숫자+특수문자</text>
  <text x="608" y="308" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fca5a5">❌ 생일/이름</text>
  <text x="608" y="328" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fca5a5">❌ 시드구문과</text>
  <text x="608" y="346" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fca5a5">   동일하게 X</text>

  <rect x="604" y="358" width="152" height="1" fill="#334155"/>
  <text x="608" y="376" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">⚠ 분실 시 시드구문으로만</text>
  <text x="608" y="392" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">   복구 가능</text>
</svg>
