<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="680" cy="-30" r="250" fill="white" fill-opacity="0.02"/>
  <circle cx="750" cy="460" r="180" fill="white" fill-opacity="0.02"/>

  <!-- Right panel: environment icons -->
  <g transform="translate(400, 50)">
    <rect width="360" height="340" rx="14" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08" stroke-width="1"/>

    <!-- JDK -->
    <rect x="24" y="28" width="312" height="52" rx="8" fill="white" fill-opacity="0.06"/>
    <rect x="36" y="40" width="28" height="28" rx="6" fill="#f59e0b" fill-opacity="0.8"/>
    <text x="50" y="59" font-family="Arial" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">J</text>
    <text x="76" y="60" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="white">JDK 17</text>
    <text x="76" y="75" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">Java Development Kit</text>
    <circle cx="312" cy="54" r="5" fill="#4ade80"/>

    <!-- Node.js -->
    <rect x="24" y="92" width="312" height="52" rx="8" fill="white" fill-opacity="0.06"/>
    <rect x="36" y="104" width="28" height="28" rx="6" fill="#22c55e" fill-opacity="0.8"/>
    <text x="50" y="123" font-family="Arial" font-size="12" font-weight="800" fill="white" text-anchor="middle">N</text>
    <text x="76" y="124" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="white">Node.js 20</text>
    <text x="76" y="139" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">React 빌드 환경</text>
    <circle cx="312" cy="118" r="5" fill="#4ade80"/>

    <!-- Oracle XE -->
    <rect x="24" y="156" width="312" height="52" rx="8" fill="white" fill-opacity="0.06"/>
    <rect x="36" y="168" width="28" height="28" rx="6" fill="#ef4444" fill-opacity="0.8"/>
    <text x="50" y="187" font-family="Arial" font-size="11" font-weight="800" fill="white" text-anchor="middle">DB</text>
    <text x="76" y="188" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="white">Oracle XE 21c</text>
    <text x="76" y="203" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">무료 데이터베이스</text>
    <circle cx="312" cy="182" r="5" fill="#4ade80"/>

    <!-- IDE -->
    <rect x="24" y="220" width="312" height="52" rx="8" fill="white" fill-opacity="0.06"/>
    <rect x="36" y="232" width="28" height="28" rx="6" fill="#6366f1" fill-opacity="0.8"/>
    <text x="50" y="251" font-family="Arial" font-size="10" font-weight="800" fill="white" text-anchor="middle">IDE</text>
    <text x="76" y="252" font-family="'Segoe UI', Arial" font-size="13" font-weight="700" fill="white">IntelliJ IDEA</text>
    <text x="76" y="267" font-family="'Segoe UI', Arial" font-size="11" fill="white" fill-opacity="0.5">Community Edition</text>
    <circle cx="312" cy="246" r="5" fill="#4ade80"/>

    <!-- Series badge -->
    <rect x="24" y="292" width="60" height="24" rx="12" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1"/>
    <text x="54" y="309" font-family="'Segoe UI', Arial" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">1 / 4</text>
  </g>

  <!-- Spring leaf -->
  <g transform="translate(46, 52)">
    <ellipse cx="44" cy="44" rx="40" ry="22" fill="#4ade80" fill-opacity="0.18" transform="rotate(-30, 44, 44)"/>
    <ellipse cx="44" cy="44" rx="40" ry="22" fill="#4ade80" fill-opacity="0.12" transform="rotate(30, 44, 44)"/>
    <circle cx="44" cy="44" r="7" fill="#4ade80" fill-opacity="0.45"/>
  </g>

  <!-- Title text -->
  <text x="50" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4ade80" fill-opacity="0.9" letter-spacing="2">SPRING BOOT SERIES</text>
  <text x="50" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="white">개발 환경</text>
  <text x="50" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#4ade80">준비하기</text>
  <text x="50" y="315" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.55">JDK · Node.js · Oracle · IDE</text>

  <rect x="50" y="345" width="72" height="26" rx="13" fill="white" fill-opacity="0.1"/>
  <text x="86" y="363" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">개발</text>
</svg>
