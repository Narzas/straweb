  <rect x="72" y="214" width="276" height="44" rx="8" fill="#f9fafb"/>
  <circle cx="96" cy="236" r="14" fill="#8247e5"/>
  <text x="96" y="242" font-family="Arial" font-size="10" font-weight="bold" fill="white" text-anchor="middle">POL</text>
  <text x="118" y="233" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111827">Polygon</text>
  <text x="118" y="249" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b7280">수수료 낮음 • MATIC</text>

  <!-- Base -->
  <rect x="72" y="266" width="276" height="44" rx="8" fill="#f9fafb"/>
  <circle cx="96" cy="288" r="14" fill="#0052ff"/>
  <text x="96" y="294" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">B</text>
