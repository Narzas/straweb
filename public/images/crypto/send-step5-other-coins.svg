  <text x="311" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">Polygon 추가 안 했다면</text>
  <text x="311" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">→ ERC-20으로 전송</text>
  <text x="311" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">(수수료 더 비쌈)</text>

  <rect x="301" y="322" width="198" height="76" rx="8" fill="#1a0533"/>
  <text x="311" y="342" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#c4b5fd">Polygon 네트워크 추천</text>
  <text x="311" y="360" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">수수료 저렴, chainlist.org</text>
  <text x="311" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">에서 추가 후 사용</text>

  <!-- BTC Card (special) -->
  <rect x="540" y="72" width="230" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="540" y="72" width="230" height="50" rx="14" fill="#f59e0b"/>
  <rect x="540" y="104" width="230" height="18" fill="#f59e0b"/>
  <circle cx="566" cy="97" r="16" fill="white" fill-opacity="0.2"/>
  <text x="566" y="102" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">₿</text>
  <text x="590" y="94" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="white">비트코인 BTC</text>
  <text x="590" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.8">주의가 필요한 케이스</text>

  <rect x="556" y="136" width="198" height="36" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="576" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">BTC 네이티브 ❌</text>
  <text x="576" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b">MetaMask는 비트코인 미지원</text>

  <rect x="556" y="180" width="198" height="36" rx="8" fill="#1e3a5f"/>
  <text x="576" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">WBTC (ERC-20) △</text>
  <text x="576" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b">래핑된 BTC / 이더리움 네트워크</text>

  <rect x="556" y="224" width="198" height="100" rx="8" fill="#0f172a"/>
  <text x="566" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fde68a">⚠ BTC는 MetaMask로</text>
  <text x="566" y="260" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#fca5a5">직접 전송 불가!</text>
  <text x="566" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">BTC는 비트코인 전용</text>
  <text x="566" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">지갑 필요 (Trust Wallet,</text>
  <text x="566" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">Coinbase Wallet 등)</text>

  <rect x="556" y="332" width="198" height="66" rx="8" fill="#1a1200"/>
  <text x="566" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#f6851b">MetaMask로 보낼 수 있는 것</text>
  <text x="566" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">ETH, ERC-20 토큰들만</text>
  <text x="566" y="386" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">(USDT, UNI, LINK 등)</text>
</svg>
