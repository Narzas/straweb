<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050d1a"/>
      <stop offset="60%" style="stop-color:#071222"/>
      <stop offset="100%" style="stop-color:#0a1a35"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:0.7"/>
      <stop offset="70%" style="stop-color:#00d4ff;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0077ff"/>
    </linearGradient>
    <linearGradient id="yieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffaa"/>
      <stop offset="100%" style="stop-color:#00cc88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="390" height="390" fill="url(#bg)"/>

  <g opacity="0.06">
    <line x1="0" y1="65" x2="390" y2="65" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="130" x2="390" y2="130" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="195" x2="390" y2="195" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="260" x2="390" y2="260" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="325" x2="390" y2="325" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="65" y1="0" x2="65" y2="390" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="130" y1="0" x2="130" y2="390" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="195" y1="0" x2="195" y2="390" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="260" y1="0" x2="260" y2="390" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="325" y1="0" x2="325" y2="390" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <ellipse cx="195" cy="170" rx="110" ry="110" fill="#00d4ff" opacity="0.04" filter="url(#softglow)"/>

  <!-- apxUSD coin -->
  <g transform="translate(120, 55)" filter="url(#glow)">
    <circle cx="40" cy="40" r="38" fill="url(#coinGrad)" opacity="0.15" stroke="#00d4ff" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
    <text x="40" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#00d4ff" text-anchor="middle">apx</text>
    <text x="40" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#00d4ff" text-anchor="middle" opacity="0.7">USD</text>
  </g>

  <!-- apyUSD coin -->
  <g transform="translate(230, 55)" filter="url(#glow)">
    <circle cx="40" cy="40" r="38" fill="url(#yieldGrad)" opacity="0.15" stroke="#00ffaa" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.4"/>
    <text x="40" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#00ffaa" text-anchor="middle">apy</text>
    <text x="40" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#00ffaa" text-anchor="middle" opacity="0.7">USD</text>
  </g>

  <g opacity="0.6">
    <line x1="200" y1="95" x2="228" y2="95" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
    <polygon points="226,91 233,95 226,99" fill="#ffffff"/>
  </g>

  <rect x="0" y="183" width="390" height="1" fill="url(#accentGrad)"/>

  <rect x="30" y="198" width="155" height="28" rx="6" fill="#00ffaa" opacity="0.1" stroke="#00ffaa" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="107" y="217" font-family="monospace" font-size="11" fill="#00ffaa" text-anchor="middle" opacity="0.9">STRC 11.25% APY</text>

  <rect x="205" y="198" width="155" height="28" rx="6" fill="#00d4ff" opacity="0.1" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="282" y="217" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle" opacity="0.9">SATA 12.25% APY</text>

  <rect x="30" y="238" width="75" height="26" rx="5" fill="#7c3aed" opacity="0.3" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="67" y="255" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle">Pendle 16x</text>

  <rect x="115" y="238" width="75" height="26" rx="5" fill="#0077ff" opacity="0.2" stroke="#60a5fa" stroke-width="0.8"/>
  <text x="152" y="255" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">Curve 12x</text>

  <rect x="200" y="238" width="75" height="26" rx="5" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="237" y="255" font-family="monospace" font-size="11" fill="#00d4ff" text-anchor="middle">Commit 10x</text>

  <rect x="285" y="238" width="75" height="26" rx="5" fill="#00ffaa" opacity="0.15" stroke="#00ffaa" stroke-width="0.8"/>
  <text x="322" y="255" font-family="monospace" font-size="11" fill="#00ffaa" text-anchor="middle">Ref +5%</text>

  <line x1="30" y1="278" x2="360" y2="278" stroke="#ffffff" stroke-width="0.4" opacity="0.15"/>

  <rect x="140" y="287" width="110" height="22" rx="11" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="195" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#00d4ff" text-anchor="middle" font-weight="600">SEASON 1 LIVE</text>

  <text x="195" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">Apyx Protocol</text>
  <text x="195" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#00d4ff" text-anchor="middle" opacity="0.8">배당금 스테이블코인 × 에어드랍 전략</text>
</svg>
