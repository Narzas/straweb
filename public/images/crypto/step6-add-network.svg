  <text x="420" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Arbitrum</text>
  <text x="530" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">낮음</text>
  <text x="610" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">빠름</text>
  <text x="690" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">DeFi</text>

  <rect x="406" y="284" width="348" height="1" fill="#334155"/>

  <!-- Tip -->
  <rect x="406" y="294" width="348" height="112" rx="8" fill="#0f172a"/>
  <text x="422" y="316" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#f6851b">💡 초보자 추천 순서</text>
  <text x="422" y="336" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">1. Ethereum Mainnet으로 시작</text>
  <text x="422" y="354" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">2. 에어드랍 노린다면 → Base 추가</text>
  <text x="422" y="372" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">3. 소액 DeFi 시작 → Polygon/Arbitrum</text>
  <text x="422" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">* chainlist.org에서 원클릭 추가 가능</text>
