<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <defs>
    <linearGradient id="cycleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="700" height="320" fill="url(#cycleBg)" rx="16"/>

  <!-- Title -->
  <text x="350" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="bold">시장 사이클과 코인판 슬랭 감정 매핑</text>

  <!-- Y-axis label -->
  <text x="22" y="170" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" transform="rotate(-90 22 170)">코인 가격</text>

  <!-- Baseline -->
  <line x1="50" y1="240" x2="660" y2="240" stroke="#475569" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Time axis labels -->
  <text x="80" y="285" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">초기 매집</text>
  <text x="220" y="285" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">상승</text>
  <text x="345" y="285" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">정점</text>
  <text x="475" y="285" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">하락</text>
  <text x="610" y="285" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">회복</text>

  <!-- Time arrow -->
  <line x1="50" y1="265" x2="660" y2="265" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="660,261 670,265 660,269" fill="#64748b"/>
  <text x="685" y="269" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">시간</text>

  <!-- Sine-ish price curve -->
  <path d="M 50,240 Q 130,225 180,180 Q 240,110 320,75 Q 360,68 400,80 Q 460,120 520,200 Q 580,250 660,230"
        stroke="url(#curveGrad)" stroke-width="3" fill="none"/>

  <!-- Slang labels with markers -->
  <!-- 1. Initial: GM / DCA -->
  <circle cx="80" cy="235" r="4" fill="#22c55e"/>
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="68" height="22" rx="11" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1"/>
    <text x="34" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#86efac">GM 🌞 / DCA</text>
  </g>
  <line x1="84" y1="148" x2="84" y2="232" stroke="#22c55e" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.5"/>

  <!-- 2. Climbing: ape in / FOMO -->
  <circle cx="220" cy="155" r="4" fill="#fbbf24"/>
  <g transform="translate(180, 90)">
    <rect x="0" y="0" width="92" height="22" rx="11" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1"/>
    <text x="46" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#fcd34d">ape in 🦍 / FOMO</text>
  </g>
  <line x1="224" y1="115" x2="224" y2="151" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.5"/>

  <!-- 3. Peak: WAGMI / moon -->
  <circle cx="350" cy="73" r="5" fill="#fbbf24"/>
  <g transform="translate(290, 38)">
    <rect x="0" y="0" width="125" height="22" rx="11" fill="#fbbf24" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="62" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fde68a">WAGMI 🙏 / moon 🚀</text>
  </g>
  <line x1="354" y1="62" x2="354" y2="68" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.5"/>

  <!-- 4. Falling: FUD -->
  <circle cx="465" cy="135" r="4" fill="#f97316"/>
  <g transform="translate(425, 80)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-width="1"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#fdba74">FUD / dump</text>
  </g>
  <line x1="465" y1="105" x2="465" y2="131" stroke="#f97316" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.5"/>

  <!-- 5. Bottom: rekt / copium -->
  <circle cx="540" cy="220" r="4" fill="#ef4444"/>
  <g transform="translate(478, 145)">
    <rect x="0" y="0" width="125" height="22" rx="11" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1"/>
    <text x="62" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">rekt 💀 / copium</text>
  </g>
  <line x1="540" y1="170" x2="540" y2="216" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.5"/>

  <!-- 6. Diamond hands at bottom -->
  <g transform="translate(478, 175)">
    <rect x="0" y="0" width="125" height="22" rx="11" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-width="1"/>
    <text x="62" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">diamond hands 💎</text>
  </g>

  <!-- 7. Recovery: GMI? -->
  <circle cx="640" cy="232" r="4" fill="#22c55e"/>
  <g transform="translate(610, 175)">
    <rect x="0" y="0" width="62" height="22" rx="11" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1"/>
    <text x="31" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#86efac">GMI? ✨</text>
  </g>
  <line x1="640" y1="197" x2="640" y2="228" stroke="#22c55e" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.5"/>

  <!-- Bottom note -->
  <text x="350" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">감정은 사이클을 그리고, 슬랭은 그 감정에 이름을 붙인 것</text>
</svg>
