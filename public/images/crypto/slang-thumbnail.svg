<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="slangBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="bubbleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <rect width="390" height="390" fill="url(#slangBg)"/>

  <!-- Decorative gridlines -->
  <g stroke="white" stroke-opacity="0.04">
    <line x1="0" y1="120" x2="390" y2="120" stroke-width="1"/>
    <line x1="0" y1="200" x2="390" y2="200" stroke-width="1"/>
    <line x1="0" y1="280" x2="390" y2="280" stroke-width="1"/>
  </g>

  <!-- Decorative glowing circles -->
  <circle cx="340" cy="60" r="80" fill="#6366f1" fill-opacity="0.12"/>
  <circle cx="60" cy="340" r="80" fill="#a855f7" fill-opacity="0.12"/>

  <!-- Chat bubbles -->
  <!-- Bubble 1: GM 🌞 (top-right) -->
  <g transform="translate(245, 195)">
    <rect x="0" y="0" width="110" height="38" rx="19" fill="url(#bubbleGrad)"/>
    <text x="55" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="white">GM 🌞</text>
  </g>

  <!-- Bubble 2: WAGMI (left) -->
  <g transform="translate(35, 235)">
    <rect x="0" y="0" width="115" height="38" rx="19" fill="url(#bubbleGold)"/>
    <text x="57" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="white">WAGMI 🙏</text>
  </g>

  <!-- Bubble 3: ape in 🦍 (right) -->
  <g transform="translate(190, 280)">
    <rect x="0" y="0" width="135" height="38" rx="19" fill="white" fill-opacity="0.18"/>
    <text x="67" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="white">ape in 🦍</text>
  </g>

  <!-- Bubble 4: NGMI ❌ (left) -->
  <g transform="translate(50, 302)">
    <rect x="0" y="0" width="105" height="34" rx="17" fill="white" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="52" y="22" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#fca5a5">NGMI ❌</text>
  </g>

  <!-- Title -->
  <text x="30" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="white">코인판</text>
  <text x="30" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="white">슬랭 사전</text>

  <!-- Year badge -->
  <rect x="222" y="50" width="68" height="32" rx="16" fill="white" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="256" y="71" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">2026</text>

  <!-- Subtitle -->
  <text x="30" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7">GM · WAGMI · NGMI · DYOR</text>
  <text x="30" y="166" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7">FOMO · rekt · copium · ape in</text>

  <!-- Bottom badge -->
  <rect x="30" y="345" width="56" height="26" rx="13" fill="white" fill-opacity="0.18"/>
  <text x="58" y="363" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="white">크립토</text>
</svg>
