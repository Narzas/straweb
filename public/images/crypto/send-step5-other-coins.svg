<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="30" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="white">다른 코인 보내기 — 코인별 네트워크 정리</text>

  <!-- USDT Card -->
  <rect x="30" y="72" width="230" height="340" rx="14" fill="#1e293b" stroke="#26a17b" stroke-width="2"/>
  <!-- Header -->
  <rect x="30" y="72" width="230" height="50" rx="14" fill="#26a17b"/>
  <rect x="30" y="104" width="230" height="18" fill="#26a17b"/>
  <circle cx="56" cy="97" r="16" fill="white" fill-opacity="0.2"/>
  <text x="56" y="102" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">USDT</text>
  <text x="80" y="94" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="white">테더 USDT</text>
  <text x="80" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.8">달러 연동 스테이블코인</text>

  <!-- USDT networks -->
  <rect x="46" y="136" width="198" height="36" rx="8" fill="#064e3b"/>
  <text x="66" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#86efac">ERC-20</text>
  <text x="66" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b">이더리움 / MetaMask 기본</text>
  <text x="234" y="157" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#22c55e" text-anchor="end">✓</text>

  <rect x="46" y="180" width="198" height="36" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="66" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">TRC-20</text>
  <text x="66" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b">트론 / MetaMask 지원 안 함</text>
  <text x="234" y="197" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#ef4444" text-anchor="end">✗</text>

  <rect x="46" y="224" width="198" height="36" rx="8" fill="#1e293b" stroke="#f3ba2f" stroke-width="1"/>
  <text x="66" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#fde68a">BEP-20</text>
  <text x="66" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b">바이낸스 / BSC 추가 필요</text>
  <text x="234" y="241" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#f3ba2f" text-anchor="end">△</text>

  <rect x="46" y="278" width="198" height="36" rx="8" fill="#1e293b" stroke="#8247e5" stroke-width="1"/>
  <text x="66" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd">Polygon</text>
  <text x="66" y="306" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b">폴리곤 / Polygon 추가 필요</text>
  <text x="234" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8247e5" text-anchor="end">△</text>

  <rect x="46" y="330" width="198" height="68" rx="8" fill="#0f172a"/>
  <text x="56" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#f6851b">💡 핵심</text>
  <text x="56" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">MetaMask로 받으려면</text>
  <text x="56" y="384" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">반드시 ERC-20 선택</text>

  <!-- POL/MATIC Card -->
  <rect x="285" y="72" width="230" height="340" rx="14" fill="#1e293b" stroke="#8247e5" stroke-width="2"/>
  <rect x="285" y="72" width="230" height="50" rx="14" fill="#8247e5"/>
  <rect x="285" y="104" width="230" height="18" fill="#8247e5"/>
  <circle cx="311" cy="97" r="16" fill="white" fill-opacity="0.2"/>
  <text x="311" y="102" font-family="Arial" font-size="9" font-weight="bold" fill="white" text-anchor="middle">POL</text>
  <text x="335" y="94" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="white">폴리곤 POL</text>
  <text x="335" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.8">이더리움 L2 토큰</text>

  <rect x="301" y="136" width="198" height="36" rx="8" fill="#3b1d8a"/>
  <text x="321" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd">Polygon (MATIC)</text>
  <text x="321" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b">폴리곤 네트워크 / 추가 필요</text>
  <text x="489" y="157" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8247e5" text-anchor="end">△</text>

  <rect x="301" y="180" width="198" height="36" rx="8" fill="#1e3a5f"/>
  <text x="321" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">ERC-20</text>
  <text x="321" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#64748b">이더리움 / MetaMask 기본</text>
  <text x="489" y="197" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#22c55e" text-anchor="end">✓</text>

  <rect x="301" y="228" width="198" height="82" rx="8" fill="#0f172a"/>
