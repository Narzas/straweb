<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="390" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="340" cy="50" r="120" fill="white" fill-opacity="0.04"/>
  <circle cx="50" cy="340" r="100" fill="white" fill-opacity="0.04"/>

  <!-- Software wallet card -->
  <rect x="30" y="170" width="150" height="110" rx="14" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="105" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#60a5fa" text-anchor="middle">🦊</text>
  <text x="105" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">소프트웨어 지갑</text>
  <text x="105" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">MetaMask · 편리함</text>
  <text x="105" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">⚠ 인터넷 노출</text>

  <!-- VS -->
  <text x="195" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="white" fill-opacity="0.4" text-anchor="middle">VS</text>

  <!-- Hardware wallet card -->
  <rect x="210" y="170" width="150" height="110" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="285" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#34d399" text-anchor="middle">🔒</text>
  <text x="285" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">하드웨어 지갑</text>
  <text x="285" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">Ledger · 보안</text>
  <text x="285" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">✓ 오프라인 보관</text>

  <!-- Title -->
  <text x="30" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="white">내 코인, 어디에</text>
  <text x="30" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="white">보관할까</text>

  <!-- Subtitle -->
  <text x="30" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.55">소프트웨어 지갑 vs 렛저 하드웨어 지갑</text>

  <!-- Bottom badge -->
  <rect x="30" y="308" width="52" height="24" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="56" y="325" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">크립토</text>
</svg>
