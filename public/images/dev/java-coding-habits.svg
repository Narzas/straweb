<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="60%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a0a28"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c2e"/>
      <stop offset="100%" style="stop-color:#12121e"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f89820"/>
      <stop offset="100%" style="stop-color:#e05a00"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f89820;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#f89820;stop-opacity:0.7"/>
      <stop offset="70%" style="stop-color:#f89820;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#f89820;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="390" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.07">
    <line x1="0" y1="65" x2="390" y2="65" stroke="#f89820" stroke-width="0.5"/>
    <line x1="0" y1="130" x2="390" y2="130" stroke="#f89820" stroke-width="0.5"/>
    <line x1="0" y1="195" x2="390" y2="195" stroke="#f89820" stroke-width="0.5"/>
    <line x1="0" y1="260" x2="390" y2="260" stroke="#f89820" stroke-width="0.5"/>
    <line x1="0" y1="325" x2="390" y2="325" stroke="#f89820" stroke-width="0.5"/>
    <line x1="65" y1="0" x2="65" y2="390" stroke="#f89820" stroke-width="0.5"/>
    <line x1="130" y1="0" x2="130" y2="390" stroke="#f89820" stroke-width="0.5"/>
    <line x1="195" y1="0" x2="195" y2="390" stroke="#f89820" stroke-width="0.5"/>
    <line x1="260" y1="0" x2="260" y2="390" stroke="#f89820" stroke-width="0.5"/>
    <line x1="325" y1="0" x2="325" y2="390" stroke="#f89820" stroke-width="0.5"/>
  </g>

  <!-- Center glow blob -->
  <ellipse cx="195" cy="195" rx="120" ry="120" fill="#f89820" opacity="0.04" filter="url(#softglow)"/>

  <!-- Java cup icon (simplified) -->
  <g transform="translate(145, 60)" filter="url(#glow)">
    <!-- Cup body -->
    <path d="M15 10 L85 10 L75 80 L25 80 Z" fill="url(#javaGrad)" opacity="0.95"/>
    <!-- Cup handle -->
    <path d="M85 25 Q105 25 105 45 Q105 65 85 65" fill="none" stroke="#f89820" stroke-width="5" stroke-linecap="round"/>
    <!-- Steam lines -->
    <path d="M35 0 Q38 -8 35 -16" fill="none" stroke="#f89820" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M50 0 Q53 -9 50 -18" fill="none" stroke="#f89820" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M65 0 Q68 -8 65 -16" fill="none" stroke="#f89820" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Shine on cup -->
    <path d="M25 20 L35 20" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Accent line -->
  <rect x="0" y="185" width="390" height="1" fill="url(#accentGrad)"/>

  <!-- Code snippets background cards -->
  <rect x="30" y="200" width="330" height="30" rx="6" fill="url(#cardGrad)" opacity="0.8"/>
  <rect x="30" y="240" width="280" height="30" rx="6" fill="url(#cardGrad)" opacity="0.8"/>
  <rect x="30" y="280" width="305" height="30" rx="6" fill="url(#cardGrad)" opacity="0.8"/>

  <!-- Code text lines -->
  <text x="46" y="220" font-family="monospace" font-size="11" fill="#f89820" opacity="0.9">public</text>
  <text x="90" y="220" font-family="monospace" font-size="11" fill="#7c9cbf" opacity="0.9">class</text>
  <text x="128" y="220" font-family="monospace" font-size="11" fill="#c9d1d9" opacity="0.9">CleanCode</text>
  <text x="46" y="260" font-family="monospace" font-size="11" fill="#f89820" opacity="0.9">final</text>
  <text x="82" y="260" font-family="monospace" font-size="11" fill="#c9d1d9" opacity="0.9">var</text>
  <text x="106" y="260" font-family="monospace" font-size="11" fill="#c9d1d9" opacity="0.9">result =</text>
  <text x="158" y="260" font-family="monospace" font-size="11" fill="#7c9cbf" opacity="0.9">stream()</text>
  <text x="46" y="300" font-family="monospace" font-size="11" fill="#f89820" opacity="0.9">record</text>
  <text x="89" y="300" font-family="monospace" font-size="11" fill="#c9d1d9" opacity="0.9">User(String</text>
  <text x="186" y="300" font-family="monospace" font-size="11" fill="#7c9cbf" opacity="0.9">name</text>
  <text x="218" y="300" font-family="monospace" font-size="11" fill="#c9d1d9" opacity="0.9">) {}</text>

  <!-- Title text -->
  <text x="195" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">Java 코딩 습관</text>
  <text x="195" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f89820" text-anchor="middle" opacity="0.8">실력 차이를 만드는 실전 기법</text>
</svg>
