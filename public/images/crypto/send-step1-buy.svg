<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Step badge -->
  <rect x="30" y="24" width="80" height="28" rx="14" fill="#6366f1"/>
  <text x="70" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">STEP 1</text>
  <text x="30" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="white">거래소에서 코인 구매</text>

  <!-- Phone mockup (업비트 app) -->
  <rect x="50" y="108" width="240" height="320" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Phone notch -->
  <rect x="130" y="114" width="80" height="12" rx="6" fill="#0f172a"/>
  <!-- Screen -->
  <rect x="58" y="132" width="224" height="288" rx="10" fill="#ffffff"/>

  <!-- App header -->
  <rect x="58" y="132" width="224" height="44" fill="#0062df"/>
  <text x="170" y="159" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle">업비트</text>

  <!-- Coin list -->
  <!-- ETH row -->
  <rect x="66" y="184" width="208" height="48" rx="0" fill="#ffffff"/>
  <circle cx="90" cy="208" r="14" fill="#627eea"/>
  <text x="90" y="213" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Ξ</text>
  <text x="112" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">이더리움 ETH</text>
  <text x="112" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280">₩ 2,914,000</text>
  <text x="266" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#ef4444" text-anchor="end">+3.2%</text>

  <rect x="66" y="232" width="208" height="1" fill="#f3f4f6"/>

  <!-- USDT row -->
  <rect x="66" y="233" width="208" height="48" rx="0" fill="#ffffff"/>
  <circle cx="90" cy="257" r="14" fill="#26a17b"/>
  <text x="90" y="262" font-family="Arial" font-size="9" font-weight="bold" fill="white" text-anchor="middle">USDT</text>
  <text x="112" y="253" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">테더 USDT</text>
  <text x="112" y="269" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280">₩ 1,438</text>
  <text x="266" y="253" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="end">+0.0%</text>

  <rect x="66" y="281" width="208" height="1" fill="#f3f4f6"/>

  <!-- MATIC row -->
  <rect x="66" y="282" width="208" height="48" fill="#ffffff"/>
  <circle cx="90" cy="306" r="14" fill="#8247e5"/>
  <text x="90" y="311" font-family="Arial" font-size="9" font-weight="bold" fill="white" text-anchor="middle">POL</text>
  <text x="112" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">폴리곤 POL</text>
  <text x="112" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280">₩ 372</text>
  <text x="266" y="302" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#ef4444" text-anchor="end">+1.8%</text>

  <!-- Buy button -->
  <rect x="76" y="342" width="188" height="36" rx="8" fill="#0062df"/>
  <text x="170" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">매수</text>

  <!-- Right: Info cards -->
  <rect x="320" y="108" width="220" height="148" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="340" y="134" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">구매 방법 두 가지</text>
  <rect x="336" y="142" width="188" height="1" fill="#334155"/>
  <rect x="336" y="152" width="188" height="40" rx="8" fill="#312e81" fill-opacity="0.5"/>
  <text x="350" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">지정가 매수</text>
  <text x="350" y="184" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">내가 원하는 가격 입력, 체결 대기</text>
  <rect x="336" y="200" width="188" height="40" rx="8" fill="#1e3a5f" fill-opacity="0.5"/>
  <text x="350" y="216" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">시장가 매수</text>
  <text x="350" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">현재 가격으로 즉시 체결 (초보 추천)</text>

  <!-- Fee info -->
  <rect x="320" y="268" width="220" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="340" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">거래소 수수료</text>
  <text x="340" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">업비트: 매수/매도 0.05%</text>
  <text x="340" y="328" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">빗썸: 매수/매도 0.04%</text>

  <!-- Tip box -->
  <rect x="560" y="108" width="210" height="240" rx="12" fill="#1e293b" stroke="#f6851b" stroke-width="1.5"/>
  <rect x="560" y="108" width="210" height="40" rx="12" fill="#f6851b" fill-opacity="0.9"/>
  <rect x="560" y="132" width="210" height="16" fill="#f6851b" fill-opacity="0.9"/>
  <text x="665" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="white" text-anchor="middle">💡 초보자 팁</text>

  <text x="576" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">처음엔 소액으로 시작</text>
  <text x="576" y="186" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">1만원~5만원부터 연습</text>

  <rect x="576" y="200" width="178" height="1" fill="#334155"/>

  <text x="576" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">ETH 추천 이유:</text>
  <text x="576" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">✅ 대부분 DeFi/NFT</text>
  <text x="576" y="256" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">    에서 사용</text>
  <text x="576" y="274" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">✅ MetaMask 기본</text>
  <text x="576" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">    네트워크 코인</text>
  <text x="576" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#86efac">✅ 출금 간편</text>

  <!-- Bottom note -->
  <rect x="320" y="366" width="450" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="336" y="386" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">⚠ 구매 후 바로 출금하지 말 것 — 거래소마다 첫 출금 24시간 지연 정책 있음</text>
  <text x="336" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">    (KYC 인증 완료 + 출금 주소 등록 먼저 해두는 것 추천)</text>
</svg>
